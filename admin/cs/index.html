function getWIBTimeInfo() {
  const now = new Date();
  const wibFormatter = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Jakarta",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });
  const parts = wibFormatter.formatToParts(now);
  const map = {};
  parts.forEach((p) => {
    map[p.type] = p.value;
  });

  const year = Number(map.year);
  const month = Number(map.month);
  const day = Number(map.day);
  const hour = Number(map.hour === "24" ? "0" : map.hour);
  const minute = Number(map.minute);
  const dayOfWeek = new Date(Date.UTC(year, month - 1, day)).getUTCDay();

  return {
    dateStr: `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`,
    totalMinutes: hour * 60 + minute,
    dayOfWeek
  };
}

function getTodayString() {

function getScheduledMarketByTime() {
  const { totalMinutes, dayOfWeek } = getWIBTimeInfo();
  let activeMarket = JADWAL_PASARAN[JADWAL_PASARAN.length - 1];

  for (let i = 0; i < JADWAL_PASARAN.length; i++) {
    const item = JADWAL_PASARAN[i];
    const isClosedToday = Array.isArray(item.closedDays) && item.closedDays.includes(dayOfWeek);
    if (!isClosedToday && totalMinutes >= item.startMinute) {
      activeMarket = item;
    }
  }
  return activeMarket;
}

  const startIndex = JADWAL_PASARAN.findIndex((item) => item.key === selectedKey);
  const safeStart = startIndex >= 0 ? startIndex : 0;

  const picked = [];

function getLatestEntryFromObject(obj) {
  if (!obj) return { date: "", data: "" };
  if (typeof obj !== "object") return { date: "", data: String(obj) };
  const keys = Object.keys(obj);
  if (keys.length === 0) return { date: "", data: "" };

  keys.sort((a, b) => {
    const partsA = a.split("-");
    const partsB = b.split("-");
    if (partsA.length === 3 && partsB.length === 3) {
      const timeA = new Date(`${partsA[2]}-${partsA[1]}-${partsA[0]}`).getTime();
      const timeB = new Date(`${partsB[2]}-${partsB[1]}-${partsB[0]}`).getTime();
      if (!isNaN(timeA) && !isNaN(timeB)) return timeA - timeB;
    }
    return a.localeCompare(b);
  });

  const latestKey = keys[keys.length - 1];
  return { date: latestKey, data: String(obj[latestKey]) };
}

function normalizeWaNumber(rawInput) {
  if (rawInput === null || rawInput === undefined) return "";
  let digits = String(rawInput).replace(/\D/g, "");
  if (!digits) return "";
  if (digits.startsWith("00")) {
    digits = digits.slice(2);
  }
  if (digits.startsWith("0")) {
    digits = "62" + digits.slice(1);
  } else if (digits.startsWith("8")) {
    digits = "62" + digits;
  }
  if (!digits.startsWith("62") || digits.length < 9 || digits.length > 16) {
    return "";
  }
  return digits;
}

function extractWaNumberFromValue(val) {
  if (val === null || val === undefined) return "";
  if (typeof val === "string" || typeof val === "number") {
    const str = String(val).trim();
    const waMatch = str.match(/wa\.me\/(\d{7,17})/i) || str.match(/phone=(\d{7,17})/i);
    if (waMatch && waMatch[1]) {
      const fromUrl = normalizeWaNumber(waMatch[1]);
      if (fromUrl) return fromUrl;
    }
    return normalizeWaNumber(str);
  }
  if (Array.isArray(val)) {
    for (let i = 0; i < val.length; i++) {
      const found = extractWaNumberFromValue(val[i]);
      if (found) return found;
    }
    return "";
  }
  if (typeof val === "object") {
    const preferredKeys = ["wa", "whatsapp", "nomor", "number", "phone", "hp", "no_wa", "wa_number", "link", "url"];
    for (let i = 0; i < preferredKeys.length; i++) {
      const k = preferredKeys[i];
      if (Object.prototype.hasOwnProperty.call(val, k)) {
        const found = extractWaNumberFromValue(val[k]);
        if (found) return found;
      }
    }
    const keys = Object.keys(val);
    for (let i = 0; i < keys.length; i++) {
      const found = extractWaNumberFromValue(val[keys[i]]);
      if (found) return found;
    }
  }
  return "";
}

// Pisah spasi, koma, atau baris baru
function normalizeBoLinks(rawText) {
  return (rawText || "")
    .split(/[\s,]+/)
    .map((item) => item.trim())
    .filter(Boolean)
    .map((url) => (/^https?:\/\//i.test(url) ? url : `https://${url}`));
}

function extractExistingBoLinks(val) {
  const found = [];
  const seen = new Set();

  function addItem(raw) {
    if (typeof raw === "string") {
      normalizeBoLinks(raw).forEach((u) => {
        if (!seen.has(u)) {
          seen.add(u);
          found.push(u);
        }
      });
    } else if (raw && typeof raw === "object") {
      const candidate = raw.url || raw.link || raw.href || "";
      if (typeof candidate === "string") addItem(candidate);
    }
  }

  if (Array.isArray(val)) {
    val.forEach(addItem);
  } else if (val && typeof val === "object") {
    if (Array.isArray(val.links)) val.links.forEach(addItem);
    Object.keys(val).forEach((k) => {
      if (k !== "links") addItem(val[k]);
    });
  } else if (typeof val === "string") {
    addItem(val);
  }

  return found;
}

function writeBoLinksPayload(links) {
  const unique = Array.from(new Set((links || []).map((u) => String(u || "").trim()).filter(Boolean)));
  const ref = database.ref(BO_BANNER_DB_PATH);
  if (!unique.length) {
    return ref.remove().then(() => []);
  }
  const payload = unique.length === 1 ? unique[0] : unique;
  return ref.set(payload).then(() => unique);
}

function saveBoBannerLink(mode) {
  const saveMode = mode === "overwrite" ? "overwrite" : "append";
  const inputEl = document.getElementById("inputBoBannerLink");
  const statusEl = document.getElementById("boLinkStatus");

  if (!firebase.auth().currentUser) {
    statusEl.style.color = "#fda4af";
    statusEl.textContent = "Sesi login berakhir. Silakan login ulang terlebih dahulu.";
    document.getElementById("adminLoginOverlay").style.display = "flex";
    return;
  }

  const inputLinks = normalizeBoLinks(inputEl.value);
  if (!inputLinks.length) {
    statusEl.style.color = "#fda4af";
    statusEl.textContent = "Masukkan minimal 1 link (pisah spasi jika lebih dari 1).";
    return;
  }

  setBoActionButtonsDisabled(true);
  statusEl.style.color = "#fda4af";
  statusEl.textContent = saveMode === "overwrite"
    ? "Menimpa link di Firebase..."
    : "Menyambungkan link ke Firebase...";

  const ref = database.ref(BO_BANNER_DB_PATH);
  const task = saveMode === "overwrite"
    ? Promise.resolve(Array.from(new Set(inputLinks)))
    : ref.once("value").then((snap) => {
        const existing = extractExistingBoLinks(snap.val());
        return Array.from(new Set(existing.concat(inputLinks)));
      });

  task
    .then((merged) => writeBoLinksPayload(merged))
    .then((savedLinks) => {
      inputEl.value = "";
      statusEl.style.color = "#6ee7b7";
      statusEl.innerHTML = `${saveMode === "overwrite" ? "Berhasil ditimpa" : "Berhasil disambung"} (${savedLinks.length}): <span style="color:#fde68a;">${savedLinks.join(" • ")}</span>`;
    })
    .catch((err) => {
      statusEl.style.color = "#fda4af";
      statusEl.textContent = "Gagal mengirim link: " + err.message;
    })
    .finally(() => {
      setBoActionButtonsDisabled(false);
    });
}

function deleteBoBannerLinkByInput() {
  const inputEl = document.getElementById("inputBoBannerLink");
  const statusEl = document.getElementById("boLinkStatus");

  if (!firebase.auth().currentUser) {
    statusEl.style.color = "#fda4af";
    statusEl.textContent = "Sesi login berakhir. Silakan login ulang terlebih dahulu.";
    document.getElementById("adminLoginOverlay").style.display = "flex";
    return;
  }

  const targets = normalizeBoLinks(inputEl.value);
  if (!targets.length) {
    statusEl.style.color = "#fda4af";
    statusEl.textContent = "Masukkan link usang yang ingin dihapus (pisah spasi jika lebih dari 1).";
    return;
  }

  // Cocokkan URL penuh maupun host/path tanpa protokol
  const targetSet = new Set();
  targets.forEach((u) => {
    targetSet.add(u.toLowerCase());
    targetSet.add(u.replace(/^https?:\/\//i, "").replace(/\/+$/, "").toLowerCase());
  });

  function isTargetMatch(existingUrl) {
    const cleanFull = existingUrl.trim().toLowerCase();
    const cleanHostPath = existingUrl.trim().replace(/^https?:\/\//i, "").replace(/\/+$/, "").toLowerCase();
    return targetSet.has(cleanFull) || targetSet.has(cleanHostPath);
  }

  setBoActionButtonsDisabled(true);
  statusEl.style.color = "#fda4af";
  statusEl.textContent = "Menghapus link usang...";

  const ref = database.ref(BO_BANNER_DB_PATH);
  ref.once("value")
    .then((snap) => {
      const existing = extractExistingBoLinks(snap.val());
      const removed = existing.filter(isTargetMatch);
      const remaining = existing.filter((u) => !isTargetMatch(u));

      if (!removed.length) {
        return { notFound: true, remaining: existing, removed: [] };
      }

      return writeBoLinksPayload(remaining).then((savedLinks) => ({
        notFound: false,
        remaining: savedLinks,
        removed
      }));
    })
    .then((res) => {
      if (res.notFound) {
        statusEl.style.color = "#fde68a";
        statusEl.textContent = "Link tersebut tidak ditemukan di daftar aktif.";
        return;
      }
      inputEl.value = "";
      statusEl.style.color = "#6ee7b7";
      const sisaText = res.remaining.length ? res.remaining.join(" • ") : "Kosong (pakai link default)";
      statusEl.innerHTML = `Dihapus: <span style="color:#fde68a;">${res.removed.join(", ")}</span> | Aktif: <span style="color:#fde68a;">${sisaText}</span>`;
    })
    .catch((err) => {
      statusEl.style.color = "#fda4af";
      statusEl.textContent = "Gagal menghapus link: " + err.message;
    })
    .finally(() => {
      setBoActionButtonsDisabled(false);
    });
}

function saveDataPaito() {
  const msgEl = document.getElementById("message");
  const btnUpdate = document.getElementById("btnUpdatePaito");

  if (!firebase.auth().currentUser) {
    msgEl.style.color = "#fda4af";
    msgEl.textContent = "Sesi login berakhir. Silakan login ulang terlebih dahulu.";

  }

  const marketKey = document.getElementById("marketSelect").value;
  const cfg = getMarketConfig(marketKey);
  const dbPath = cfg.dbKey;
  const rawDate = document.getElementById("inputDate").value || getTodayString();
  const rawNumbers = document.getElementById("inputNumbers").value.trim();

  if (!rawNumbers) {
    msgEl.style.color = "#fda4af";
    msgEl.textContent = "Angka tidak boleh kosong!";
    return;
  }

  const dateParts = rawDate.split("-");
  const formattedDate = `${dateParts[2]}-${dateParts[1]}-${dateParts[0]}`;
  const ref = database.ref("live/" + dbPath);

  btnUpdate.disabled = true;
  msgEl.style.color = "#fda4af";
  msgEl.textContent = `Menyimpan data ${cfg.label}...`;

  ref.once("value").then((snapshot) => {
    const existingObj = snapshot.val();
    let finalNumbers = rawNumbers;
    if (existingObj && typeof existingObj === "object" && existingObj[formattedDate]) {
      const prevData = existingObj[formattedDate];
      if (typeof prevData === "string" && prevData.trim() !== "") {
        finalNumbers = prevData + "," + rawNumbers;
      }
    }
    return ref.update({ [formattedDate]: finalNumbers });
  }).then(() => {
    msgEl.style.color = "#6ee7b7";
    msgEl.textContent = `Berhasil menyimpan data ${cfg.label} untuk tanggal ${formattedDate}!`;
    document.getElementById("inputNumbers").value = "";

  }).catch((err) => {

    msgEl.textContent = "Gagal menyimpan: " + err.message;
  }).finally(() => {

  });

    const activeMarket = getScheduledMarketByTime();
    if (activeMarket.key !== lastTrackedKey) {
      lastTrackedKey = activeMarket.key;
      const selectEl = document.getElementById("marketSelect");
      if (selectEl) {
        selectEl.value = activeMarket.key;
        refreshAllFormPreviews();
      }
    }
  }, 15000);

  document.getElementById("marketSelect")?.addEventListener("change", (e) => {
    isManualMarketSelection = true;
    lastTrackedKey = e.target.value;
    updateSelectionModeBadge();
    refreshAllFormPreviews();
  });

  ["adminEmail", "adminPassword"].forEach((id) => {
    document.getElementById(id)?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        loginAdmin();
      }
    });
  });

  firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
    firebase.auth().onAuthStateChanged((user) => {
      const overlay = document.getElementById("adminLoginOverlay");
      const statusBadge = document.getElementById("authStatusIndicator");
      const logoutBtn = document.getElementById("btnLogout");

      if (user) {
        if (overlay) overlay.style.display = "none";
        if (statusBadge) {
          statusBadge.className = "auth-status-badge status-logged-in";
          statusBadge.innerHTML = `🟢 Status : <b>LOGIN</b> (${user.email})`;
        }
        if (logoutBtn) logoutBtn.style.display = "inline-block";
        loadWaNumber();
        loadBoBannerLink();
      } else {
        if (overlay) overlay.style.display = "flex";
        if (statusBadge) {
          statusBadge.className = "auth-status-badge status-logged-out";
          statusBadge.innerHTML = "🔴 Status : <b>LOGOUT / LOGOUT</b>";
        }
        if (logoutBtn) logoutBtn.style.display = "none";
      }
    });
  });
});
</script>
