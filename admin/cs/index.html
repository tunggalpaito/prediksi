.btn-utama{flex:1 1 100%;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:10px 14px;border-radius:8px;font-weight:700;font-size:12px;color:#fff;transition:.2s;text-transform:uppercase;box-shadow:0 4px 10px rgba(0,0,0,.4)}

.input-result-box textarea{resize:vertical;height:120px;font-family:monospace;text-align:left;font-weight:400}
.input-result-box input:focus,.input-result-box select:focus,.input-result-box textarea:focus{border-color:#38bdf8;box-shadow:0 0 8px rgba(56,189,248,.4)}
.btn-kirim{background:linear-gradient(135deg,#ff6b81,#ff4757);border:1px solid #ff7979;color:#fff;padding:12px;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer;text-transform:uppercase;transition:all .3s ease;box-shadow:0 0 15px rgba(255,71,87,.6),inset 0 1px 1px rgba(255,255,255,.4);letter-spacing:.5px}
.btn-kirim:hover:not(:disabled){background:linear-gradient(135deg,#ff4757,#ff3838);box-shadow:0 0 22px rgba(255,71,87,.9),0 0 35px rgba(255,107,129,.5);transform:translateY(-1px)}
.btn-kirim:disabled{opacity:.6;cursor:not-allowed}
.status-firebase{font-size:11px;text-align:center;color:#94a3b8;margin-top:4px;font-weight:700;line-height:1.4}
footer{text-align:center;font-size:12px;color:#475569;margin-top:10px;margin-bottom:20px}
footer span{color:#38bdf8;font-weight:700}
.btn-logout-admin{background:#dc2626;color:#fff;border:none;padding:6px 12px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;margin-top:8px;text-transform:uppercase}
.btn-logout-admin:hover{background:#b91c1c}
.login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:9999;display:flex;justify-content:center;align-items:center;padding:20px}
.login-box{background:#080808;border:1px solid #334155;padding:25px;border-radius:12px;width:100%;max-width:380px;box-shadow:0 10px 25px rgba(0,0,0,.8)}
.login-box h3{color:#38bdf8;text-align:center;margin-bottom:15px;font-size:16px;text-transform:uppercase}
.login-box input{width:100%;background:#020617;border:1px solid #334155;color:#f8fafc;padding:12px;border-radius:6px;margin-bottom:12px;font-size:14px;outline:0}
.login-box button{width:100%;background:#10b981;color:#fff;border:none;padding:12px;border-radius:6px;font-weight:700;cursor:pointer;text-transform:uppercase}
.login-error{color:#ef4444;font-size:12px;text-align:center;margin-top:8px}

<body>
<div id="adminLoginOverlay" class="login-overlay" style="display:flex">
  <div class="login-box">
    <h3>Login Staff / Admin CS</h3>
    <input type="email" id="adminEmail" value="admintunggalpaito@gmail.com" placeholder="Email Staff">
    <input type="password" id="adminPassword" placeholder="Kata Sandi Staff">
    <button type="button" id="btnLoginSubmit" onclick="loginAdmin()">MASUK PANEL CS</button>
    <div id="loginErrorMsg" class="login-error"></div>
  </div>
</div>

<div class="admin-container">
  <div class="top-tracker">
    <div id="histats_counter"></div>
  </div>

  <div class="header">
    <h2>PANEL ADMIN CS</h2>
    <div id="authStatusIndicator" class="auth-status-badge status-logged-out">Memeriksa Status Login...</div>
    <div>
      <button type="button" id="btnLogout" class="btn-logout-admin" style="display:none" onclick="logoutAdmin()">🚪 LOGOUT AKUN</button>
    </div>
    <nav class="main-nav">
      <a href="https://tunggalpaito.online/prediksi" class="btn-utama btn-menu-awal">🏠 MENU UTAMA</a>
      <a href="https://gemini.google.com/app?hl=id" target="_blank" rel="noopener noreferrer" class="btn-sub c-white">Gemini</a>
      <a href="https://beta.publishers.adsterra.com/payout-information" target="_blank" rel="noopener noreferrer" class="btn-sub c-top2d">Pembayaran Adsterra 1</a>
      <a href="https://beta.publishers.adsterra.com/payouts" target="_blank" rel="noopener noreferrer" class="btn-sub c-top2d">Pembayaran Adsterra Status</a>
      <a href="https://passport.web.money/asp/FormalPassport.asp" target="_blank" rel="noopener noreferrer" class="btn-sub c-top2d">Pembayaran Web Money</a>
    </nav>
  </div>

  <div class="section-title">📡 Update Data Paito Warna</div>
  <div class="input-result-box">
    <label for="marketSelect">Pilih Pasaran</label>
    <select id="marketSelect">
      <option value="data-sdy">SDY</option>
      <option value="data-sgp">SGP</option>
      <option value="data-hk">HK</option>
      <option value="data-sdylotto">SDY LOTTO</option>
      <option value="data-hklotto">HK LOTTO</option>
      <option value="data-cambodia">CAMBODIA</option>
      <option value="data-china">CHINA</option>
      <option value="data-japan">JAPAN</option>
      <option value="data-taiwan">TAIWAN</option>
      <option value="data-macau4d">MACAU 4D</option>
      <option value="data-macau5d">MACAU 5D</option>
    </select>

    <label for="inputDate">Pilih Tanggal Pengeluaran</label>
    <input type="date" id="inputDate">

    <label for="inputNumbers">Masukkan Angka Mingguan<br>Pisahkan dengan koma</label>
    <textarea id="inputNumbers" placeholder="Contoh: 1234, 5678, 9012, 3456, 7890"></textarea>

    <button type="button" id="btnUpdatePaito" class="btn-kirim" onclick="saveDataPaito()">Update</button>
    <div id="message" class="status-firebase"></div>
  </div>
</div>

<footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCUaQixhT9BARrtqM6roT73FbDihy8WLAA",
  authDomain: "komentar-web-f9e2e.firebaseapp.com",
  databaseURL: "https://komentar-web-f9e2e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "komentar-web-f9e2e",
  storageBucket: "komentar-web-f9e2e.firebasestorage.app",
  messagingSenderId: "126095632925",
  appId: "1:126095632925:web:77383efdc2daea2e7034f4",
  measurementId: "G-C3CVJPFTMN"
};

firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
const database = firebase.database();

function getTodayString() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
}

function autoSetDates() {
  const inputDate = document.getElementById("inputDate");
  if (inputDate) inputDate.value = getTodayString();
}

function autoSelectMarketByTime() {
  const now = new Date();
  const totalMnit = now.getHours() * 60 + now.getMinutes();
  let market = "data-hk";

  if (totalMnit >= 705 && totalMnit < 830) {
    market = "data-cambodia";
  } else if (totalMnit >= 830 && totalMnit < 840) {
    market = "data-sdy";
  } else if (totalMnit >= 840 && totalMnit < 925) {
    market = "data-sdylotto";
  } else if (totalMnit >= 925 && totalMnit < 1035) {
    market = "data-china";
  } else if (totalMnit >= 1035 && totalMnit < 1065) {
    market = "data-japan";
  } else if (totalMnit >= 1065 && totalMnit < 1248) {
    market = "data-sgp";
  } else if (totalMnit >= 1248 && totalMnit < 1380) {
    market = "data-taiwan";
  } else if (totalMnit >= 1380 && totalMnit < 1390) {
    market = "data-hk";
  } else if ((totalMnit >= 1390 && totalMnit <= 1439) || totalMnit < 705) {
    market = "data-hklotto";
  }

  const selectEl = document.getElementById("marketSelect");
  if (selectEl) selectEl.value = market;
}

function getLatestEntryFromObject(obj) {
  if (!obj) return { date: "", data: "" };
  if (typeof obj !== "object") return { date: "", data: String(obj) };
  const keys = Object.keys(obj);
  if (keys.length === 0) return { date: "", data: "" };

  keys.sort((a, b) => {
    const partsA = a.split("-");
    const partsB = b.split("-");
    if (partsA.length === 3 && partsB.length === 3) {
      const timeA = new Date(`${partsA[2]}-${partsA[1]}-${partsA[0]}`).getTime();
      const timeB = new Date(`${partsB[2]}-${partsB[1]}-${partsB[0]}`).getTime();
      if (!isNaN(timeA) && !isNaN(timeB)) return timeA - timeB;
    }
    return a.localeCompare(b);
  });

  const latestKey = keys[keys.length - 1];
  return { date: latestKey, data: String(obj[latestKey]) };
}

function showLatestDataPaito(market) {
  const msgEl = document.getElementById("message");
  if (!msgEl) return;

  msgEl.style.color = "#38bdf8";
  msgEl.innerText = "⏳ Memuat data paito terakhir...";

  database.ref(`live/${market}`).once("value").then((snapshot) => {
    if (snapshot.exists()) {
      const latest = getLatestEntryFromObject(snapshot.val());
      const items = latest.data.split(",").map((item) => item.trim()).filter(Boolean);
      const lastValue = items.length > 0 ? items[items.length - 1] : latest.data;
      msgEl.style.color = "#94a3b8";
      msgEl.innerHTML = `📌 <b>Data Terakhir${latest.date ? " (" + latest.date + ")" : ""}:</b> <span style="color:#facc15;font-size:14px;font-weight:bold;">${lastValue}</span>`;
    } else {
      msgEl.style.color = "#64748b";
      msgEl.innerText = `Belum ada data paito ${market.toUpperCase()}`;
    }
  }).catch(() => {
    msgEl.innerText = "";
  });
}

function refreshAllFormPreviews() {
  const selectedMarket = document.getElementById("marketSelect")?.value;
  if (selectedMarket) showLatestDataPaito(selectedMarket);
}

function loginAdmin() {
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value.trim();
  const errorEl = document.getElementById("loginErrorMsg");
  const submitBtn = document.getElementById("btnLoginSubmit");

  if (!email || !password) {
    errorEl.style.color = "#ef4444";
    errorEl.innerText = "⚠️ Email dan Password wajib diisi!";
    return;
  }

  submitBtn.disabled = true;
  errorEl.style.color = "#38bdf8";
  errorEl.innerText = "⏳ Memverifikasi...";

  firebase.auth().signInWithEmailAndPassword(email, password).then(() => {
    document.getElementById("adminLoginOverlay").style.display = "none";
    errorEl.innerText = "";
  }).catch((err) => {
    errorEl.style.color = "#ef4444";
    if (
      err.code === "auth/wrong-password" ||
      err.code === "auth/invalid-credential" ||
      err.code === "auth/invalid-email"
    ) {
      errorEl.innerText = "❌ Kata sandi atau email salah!";
    } else if (err.code === "auth/user-not-found") {
      errorEl.innerText = "❌ Akun staff tidak ditemukan!";
    } else {
      errorEl.innerText = "❌ Gagal: " + err.message;
    }
  }).finally(() => {
    submitBtn.disabled = false;
  });
}

function logoutAdmin() {
  firebase.auth().signOut().then(() => {
    alert("Berhasil Logout dari Panel CS.");
  }).catch((err) => {
    alert("Gagal logout: " + err.message);
  });
}

function saveDataPaito() {
  const msgEl = document.getElementById("message");
  const btnUpdate = document.getElementById("btnUpdatePaito");

  if (!firebase.auth().currentUser) {
    msgEl.style.color = "#f87171";
    msgEl.textContent = "Sesi login berakhir. Silakan login ulang terlebih dahulu.";
    document.getElementById("adminLoginOverlay").style.display = "flex";
    return;
  }

  const market = document.getElementById("marketSelect").value;
  const rawDate = document.getElementById("inputDate").value || getTodayString();
  const rawNumbers = document.getElementById("inputNumbers").value.trim();

  if (!rawNumbers) {
    msgEl.style.color = "#f87171";
    msgEl.textContent = "Angka tidak boleh kosong!";
    return;
  }

  const dateParts = rawDate.split("-");
  const formattedDate = `${dateParts[2]}-${dateParts[1]}-${dateParts[0]}`;
  const ref = database.ref("live/" + market);

  btnUpdate.disabled = true;
  msgEl.style.color = "#38bdf8";
  msgEl.textContent = `Menyimpan data ${market.toUpperCase()}...`;

  ref.once("value").then((snapshot) => {
    const existingObj = snapshot.val();
    let finalNumbers = rawNumbers;
    if (existingObj && typeof existingObj === "object" && existingObj[formattedDate]) {
      const prevData = existingObj[formattedDate];
      if (typeof prevData === "string" && prevData.trim() !== "") {
        finalNumbers = prevData + "," + rawNumbers;
      }
    }
    return ref.update({ [formattedDate]: finalNumbers });
  }).then(() => {
    msgEl.style.color = "#34d399";
    msgEl.textContent = `Berhasil menyimpan data ${market.toUpperCase()} untuk tanggal ${formattedDate}!`;
    document.getElementById("inputNumbers").value = "";
    setTimeout(() => showLatestDataPaito(market), 2500);
  }).catch((err) => {
    msgEl.style.color = "#f87171";
    msgEl.textContent = "Gagal menyimpan: " + err.message;
  }).finally(() => {
    btnUpdate.disabled = false;
  });
}

document.addEventListener("DOMContentLoaded", () => {
  autoSetDates();
  autoSelectMarketByTime();
  refreshAllFormPreviews();

  document.getElementById("marketSelect")?.addEventListener("change", (e) => {
    showLatestDataPaito(e.target.value);
  });

  ["adminEmail", "adminPassword"].forEach((id) => {
    document.getElementById(id)?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        loginAdmin();
      }
    });
  });

  firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
    firebase.auth().onAuthStateChanged((user) => {
      const overlay = document.getElementById("adminLoginOverlay");
      const statusBadge = document.getElementById("authStatusIndicator");
      const logoutBtn = document.getElementById("btnLogout");

      if (user) {
        if (overlay) overlay.style.display = "none";
        if (statusBadge) {
          statusBadge.className = "auth-status-badge status-logged-in";
          statusBadge.innerHTML = `🟢 Status: <b>SUDAH LOGIN</b> (${user.email})`;
        }
        if (logoutBtn) logoutBtn.style.display = "inline-block";
      } else {
        if (overlay) overlay.style.display = "flex";
        if (statusBadge) {
          statusBadge.className = "auth-status-badge status-logged-out";
          statusBadge.innerHTML = "🔴 Status: <b>BELUM LOGIN / LOGOUT</b>";
        }
        if (logoutBtn) logoutBtn.style.display = "none";
      }
    });
  });
});
</script>
