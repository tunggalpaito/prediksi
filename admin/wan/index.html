  { key: "data-macau4d-pt4", dbKey: "data-macau4d", roundIndex: 4, label: "MACAU 4D PT4", startMinute: 22 * 60 },

function getMacauRoundOptionKey(dbKey, roundNumber) {
  const safeRound = Math.max(1, Number(roundNumber) || 1);
  if (dbKey === "data-macau4d") {
    return MACAU_4D_ROUNDS[Math.min(safeRound - 1, MACAU_4D_ROUNDS.length - 1)];
  }
  if (dbKey === "data-macau5d") {
    return MACAU_5D_ROUNDS[Math.min(safeRound - 1, MACAU_5D_ROUNDS.length - 1)];
  }
  return null;
}

function updateSelectionModeBadge() {
  const badge = document.getElementById("selectionModeBadge");
  const resetBtn = document.getElementById("btnResetAutoMarket");

  if (isManualMarketSelection) {
    badge.className = "mode-badge mode-manual";
    badge.textContent = "Kunci";
    if (resetBtn) resetBtn.style.display = "inline-block";
  } else {
    badge.className = "mode-badge mode-auto";
    badge.textContent = "🕒 Auto";
    if (resetBtn) resetBtn.style.display = "none";
  }
}

function formatDbDateKeyFromUTCDate(utcDate) {
  const y = utcDate.getUTCFullYear();
  const m = String(utcDate.getUTCMonth() + 1).padStart(2, "0");
  const d = String(utcDate.getUTCDate()).padStart(2, "0");
  return `${d}-${m}-${y}`;
}

function formatInputDateFromUTCDate(utcDate) {
  const y = utcDate.getUTCFullYear();
  const m = String(utcDate.getUTCMonth() + 1).padStart(2, "0");
  const d = String(utcDate.getUTCDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function getWIBTimeInfo() {
  const now = new Date();
  const wibFormatter = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Jakarta",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });
  const parts = wibFormatter.formatToParts(now);
  const map = {};
  parts.forEach((p) => {
    map[p.type] = p.value;
  });

  const year = Number(map.year);
  const month = Number(map.month);
  const day = Number(map.day);
  const hour = Number(map.hour === "24" ? "0" : map.hour);
  const minute = Number(map.minute);

  const todayUtc = new Date(Date.UTC(year, month - 1, day));
  const yesterdayUtc = new Date(Date.UTC(year, month - 1, day - 1));
  const dayOfWeek = todayUtc.getUTCDay();
  const prevDayOfWeek = yesterdayUtc.getUTCDay();

  return {
    dateStr: formatInputDateFromUTCDate(todayUtc),
    prevDateStr: formatInputDateFromUTCDate(yesterdayUtc),
    dbDateKey: formatDbDateKeyFromUTCDate(todayUtc),
    prevDbDateKey: formatDbDateKeyFromUTCDate(yesterdayUtc),
    totalMinutes: hour * 60 + minute,
    dayOfWeek,
    prevDayOfWeek
  };
}

function getTodayString() {
  return getWIBTimeInfo().dateStr;
}

function getMarketConfig(marketKey) {
  return JADWAL_PASARAN.find((item) => item.key === marketKey) || JADWAL_PASARAN[0];
}

function getScheduledMarketByTime() {
  const { totalMinutes, dayOfWeek } = getWIBTimeInfo();
  let activeMarket = JADWAL_PASARAN[JADWAL_PASARAN.length - 1];

  for (let i = 0; i < JADWAL_PASARAN.length; i++) {
    const item = JADWAL_PASARAN[i];
    const isClosedToday = Array.isArray(item.closedDays) && item.closedDays.includes(dayOfWeek);
    if (!isClosedToday && totalMinutes >= item.startMinute) {
      activeMarket = item;
    }
  }
  return activeMarket;
}

function parsePaitoItems(rawData) {
  return String(rawData || "")
    .split(/[\s,]+/)
    .map((item) => item.trim())
    .filter(Boolean);
}

function getSavedRoundCount(rawEntry) {
  if (rawEntry === null || rawEntry === undefined) return 0;
  const str = Array.isArray(rawEntry)
    ? rawEntry.join(",")
    : (typeof rawEntry === "object" ? Object.values(rawEntry).join(",") : String(rawEntry));
  return parsePaitoItems(str).length;
}

function getDueCheckTargets() {
  const { totalMinutes, dayOfWeek, prevDayOfWeek, dbDateKey, prevDbDateKey, dateStr, prevDateStr } = getWIBTimeInfo();
  const targets = [];

  JADWAL_PASARAN.forEach((item) => {
    const isClosedYesterday = Array.isArray(item.closedDays) && item.closedDays.includes(prevDayOfWeek);
    const isNightMarket = item.startMinute >= 20 * 60;
    if (!isClosedYesterday && isNightMarket) {
      targets.push({
        id: `prev:${item.key}:${prevDbDateKey}`,
        key: item.key,
        dbKey: item.dbKey,
        dbDateKey: prevDbDateKey,
        inputDateStr: prevDateStr,
        label: `${item.label} (Kemarin ${prevDbDateKey})`,
        expectedMinRounds: 1
      });
    }
  });

  const dueTodayItems = JADWAL_PASARAN.filter((item) => {
    const isClosedToday = Array.isArray(item.closedDays) && item.closedDays.includes(dayOfWeek);
    return !isClosedToday && totalMinutes >= item.startMinute;
  });

  const dueCountByDbKey = {};
  dueTodayItems.forEach((item) => {
    dueCountByDbKey[item.dbKey] = (dueCountByDbKey[item.dbKey] || 0) + 1;
  });

  const seenTodayDbKey = new Set();
  dueTodayItems.forEach((item) => {
    const isMultiRound = item.dbKey === "data-macau4d" || item.dbKey === "data-macau5d";
    if (isMultiRound) {
      if (seenTodayDbKey.has(item.dbKey)) return;
      seenTodayDbKey.add(item.dbKey);
      const expectedRounds = dueCountByDbKey[item.dbKey] || 1;
      const baseLabel = item.dbKey === "data-macau4d" ? "MACAU 4D" : "MACAU 5D";
      targets.push({
        id: `today:${item.dbKey}:${dbDateKey}:r${expectedRounds}`,
        key: item.key,
        dbKey: item.dbKey,
        isMultiRound: true,
        dbDateKey,
        inputDateStr: dateStr,
        label: expectedRounds > 1 ? `${baseLabel} (Putaran ke-${expectedRounds})` : item.label,
        expectedMinRounds: expectedRounds
      });
    } else {
      targets.push({
        id: `today:${item.key}:${dbDateKey}`,
        key: item.key,
        dbKey: item.dbKey,
        isMultiRound: false,
        dbDateKey,
        inputDateStr: dateStr,
        label: item.label,
        expectedMinRounds: 1
      });
    }
  });

  return targets;
}

function openMissedMarketPopup(missedTargets) {
  const modal = document.getElementById("missedMarketModal");
  const textEl = document.getElementById("missedMarketText");
  if (!modal || !textEl || !Array.isArray(missedTargets) || !missedTargets.length) return;

  const signature = missedTargets.map((m) => m.id).join("|");
  if (signature === shownMissedPopupSignature && modal.classList.contains("is-open")) {
    return;
  }

  shownMissedPopupSignature = signature;
  firstMissedMarketTarget = missedTargets[0];

  const labelsText = missedTargets.map((m) => m.label).join(", ");
  textEl.textContent = `Hai Admin Maaf Mengganggu\nPasaran yang jadwalnya sudah terlewat dan belum ter-update adalah:\n(${labelsText}) 🙏`;
  modal.classList.add("is-open");
}

function closeMissedMarketModal() {
  const modal = document.getElementById("missedMarketModal");
  if (modal) modal.classList.remove("is-open");
}

function focusMissedMarketAndClose() {
  closeMissedMarketModal();
  if (!firstMissedMarketTarget) return;

  const selectEl = document.getElementById("marketSelect");
  const inputDateEl = document.getElementById("inputDate");

  const resolvedKey = firstMissedMarketTarget.targetSelectKey || firstMissedMarketTarget.key;
  if (selectEl) {
    selectEl.value = resolvedKey;
    isManualMarketSelection = true;
    updateSelectionModeBadge();
  }
  if (inputDateEl && firstMissedMarketTarget.inputDateStr) {
    inputDateEl.value = firstMissedMarketTarget.inputDateStr;
  }

  refreshAllFormPreviews();
  selectEl?.scrollIntoView({ behavior: "smooth", block: "center" });
}

function checkMissedScheduledMarkets() {
  if (!firebase.auth().currentUser || missedPopupCheckInFlight) return;

  const targets = getDueCheckTargets();
  if (!targets.length) {
    closeMissedMarketModal();
    return;
  }

  missedPopupCheckInFlight = true;

  Promise.all(
    targets.map((target) =>
      database
        .ref(`live/${target.dbKey}/${target.dbDateKey}`)
        .once("value")
        .then((snap) => {
          const savedRounds = snap.exists() ? getSavedRoundCount(snap.val()) : 0;
          const nextRoundNumber = Math.min(savedRounds + 1, target.expectedMinRounds);
          const roundOptionKey = target.isMultiRound
            ? getMacauRoundOptionKey(target.dbKey, nextRoundNumber)
            : target.key;
          const baseName = target.dbKey === "data-macau4d"
            ? "MACAU 4D"
            : (target.dbKey === "data-macau5d" ? "MACAU 5D" : null);
          const currentRoundLabel = target.isMultiRound
            ? `${baseName} (Putaran ke-${nextRoundNumber})`
            : target.label;

          return {
            target: {
              ...target,
              targetSelectKey: roundOptionKey || target.key,
              label: currentRoundLabel
            },
            isUpdated: savedRounds >= target.expectedMinRounds
          };
        })
        .catch(() => ({
          target,
          isUpdated: true
        }))
    )
  )
    .then((results) => {
      const missedTargets = results
        .filter((r) => !r.isUpdated)
        .map((r) => r.target);

      if (missedTargets.length > 0) {
        openMissedMarketPopup(missedTargets);
      } else {
        closeMissedMarketModal();
      }
    })
    .finally(() => {
      missedPopupCheckInFlight = false;
    });
}

function autoSetDates() {
  const inputDate = document.getElementById("inputDate");
  if (inputDate) inputDate.value = getTodayString();
}

function syncMarketToCurrentRound(baseMarket) {
  const selectEl = document.getElementById("marketSelect");
  if (!selectEl || !baseMarket) return;

  const isMultiRound = baseMarket.dbKey === "data-macau4d" || baseMarket.dbKey === "data-macau5d";
  if (!isMultiRound) {
    selectEl.value = baseMarket.key;
    updateSelectionModeBadge();
    showLatestDataPaito(baseMarket.key);
    return;
  }

  const { dbDateKey } = getWIBTimeInfo();
  const maxRound = baseMarket.dbKey === "data-macau4d" ? 6 : 2;
  const scheduledRound = Number(baseMarket.roundIndex) || 1;

  database
    .ref(`live/${baseMarket.dbKey}/${dbDateKey}`)
    .once("value")
    .then((snap) => {
      if (isManualMarketSelection) return;
      const savedRounds = snap.exists() ? getSavedRoundCount(snap.val()) : 0;
      const targetRound = Math.min(maxRound, Math.max(scheduledRound, savedRounds + 1));
      const optionKey = getMacauRoundOptionKey(baseMarket.dbKey, targetRound) || baseMarket.key;
      selectEl.value = optionKey;
      updateSelectionModeBadge();
      showLatestDataPaito(optionKey);
    })
    .catch(() => {
      if (!isManualMarketSelection) {
        selectEl.value = baseMarket.key;
        updateSelectionModeBadge();
        showLatestDataPaito(baseMarket.key);
      }
    });
}

function applyInitialMarketByTime() {
  const activeMarket = getScheduledMarketByTime();
  const selectEl = document.getElementById("marketSelect");
  if (selectEl) {
    selectEl.value = activeMarket.key;
  }
  updateSelectionModeBadge();
  syncMarketToCurrentRound(activeMarket);
}

function resetToAutoMarket() {
  isManualMarketSelection = false;
  autoSetDates();
  applyInitialMarketByTime();
}

function getLatestEntryFromObject(obj) {
  if (!obj) return { date: "", data: "" };
  if (typeof obj !== "object") return { date: "", data: String(obj) };
  const keys = Object.keys(obj);
  if (keys.length === 0) return { date: "", data: "" };

  keys.sort((a, b) => {
    const partsA = a.split("-");
    const partsB = b.split("-");
    if (partsA.length === 3 && partsB.length === 3) {
      const timeA = new Date(`${partsA[2]}-${partsA[1]}-${partsA[0]}`).getTime();
      const timeB = new Date(`${partsB[2]}-${partsB[1]}-${partsB[0]}`).getTime();
      if (!isNaN(timeA) && !isNaN(timeB)) return timeA - timeB;
    }
    return a.localeCompare(b);
  });

  const latestKey = keys[keys.length - 1];
  const rawLatestVal = obj[latestKey];
  const normalizedData = Array.isArray(rawLatestVal)
    ? rawLatestVal.join(",")
    : (rawLatestVal && typeof rawLatestVal === "object"
        ? Object.values(rawLatestVal).join(",")
        : String(rawLatestVal));

  return { date: latestKey, data: normalizedData };
}

function showLatestDataPaito(marketKey) {
  const msgEl = document.getElementById("message");
  if (!msgEl) return;

  const cfg = getMarketConfig(marketKey);
  const dbPath = cfg.dbKey;

  msgEl.style.color = "#fda4af";
  msgEl.innerText = "⏳ Memuat data paito terakhir...";

  database.ref(`live/${dbPath}`).once("value").then((snapshot) => {
    if (snapshot.exists()) {
      const latest = getLatestEntryFromObject(snapshot.val());
      const items = parsePaitoItems(latest.data);
      const lastValue = items.length > 0 ? items[items.length - 1] : latest.data;
      const roundCount = items.length;
      const hasRoundSystem = dbPath === "data-macau4d" || dbPath === "data-macau5d";
      const nextRound = roundCount + 1;
      const roundInfo = hasRoundSystem
        ? ` • <span style="color:${roundCount > 1 ? "#6ee7b7" : "#fde68a"};">putaran ke-${roundCount} (berikutnya ke-${nextRound})</span>`
        : "";
      const dateInfo = latest.date ? ` • tgl <b>${latest.date}</b>` : "";

      msgEl.style.color = "#d4b5bc";
      msgEl.innerHTML = `📌<b>Data Terakhir ${cfg.label}:</b> <span style="color:#fde68a;font-size:14px;font-weight:800;">${lastValue}</span>${dateInfo}${roundInfo}`;
    } else {
      msgEl.style.color = "#9c7a82";
      msgEl.innerText = `Belum ada data paito ${cfg.label}`;
    }
  }).catch(() => {
    msgEl.innerText = "";
  });
}

function refreshAllFormPreviews() {
  const selectedMarket = document.getElementById("marketSelect")?.value;
  if (selectedMarket) {
    showLatestDataPaito(selectedMarket);
  }
}

function loginAdmin() {
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value.trim();
  const errorEl = document.getElementById("loginErrorMsg");
  const submitBtn = document.getElementById("btnLoginSubmit");

  if (!email || !password) {
    errorEl.style.color = "#fda4af";
    errorEl.innerText = "⚠️ Email dan Password wajib di isi!";
    return;
  }

  submitBtn.disabled = true;
  errorEl.style.color = "#fda4af";
  errorEl.innerText = "⏳ Memverifikasi...";

  firebase.auth().signInWithEmailAndPassword(email, password).then(() => {
    document.getElementById("adminLoginOverlay").style.display = "none";
    errorEl.innerText = "";
    shownMissedPopupSignature = "";
    checkMissedScheduledMarkets();
  }).catch((err) => {
    errorEl.style.color = "#fda4af";
    if (
      err.code === "auth/wrong-password" ||
      err.code === "auth/invalid-credential" ||
      err.code === "auth/invalid-email"
    ) {
      errorEl.innerText = "❌ Kata sandi atau email salah!";
    } else if (err.code === "auth/user-not-found") {
      errorEl.innerText = "❌ Akun staff tidak ditemukan!";
    } else {
      errorEl.innerText = "❌ Gagal: " + err.message;
    }
  }).finally(() => {
    submitBtn.disabled = false;
  });
}

function logoutAdmin() {
  firebase.auth().signOut().then(() => {
    closeMissedMarketModal();
    alert("Berhasil Logout dari Panel CS.");
  }).catch((err) => {
    alert("Gagal logout: " + err.message);
  });
}

function saveDataPaito() {
  const msgEl = document.getElementById("message");
  const btnUpdate = document.getElementById("btnUpdatePaito");

  if (!firebase.auth().currentUser) {
    msgEl.style.color = "#fda4af";
    msgEl.textContent = "Sesi login berakhir. Silakan login ulang terlebih dahulu.";
    document.getElementById("adminLoginOverlay").style.display = "flex";
    return;
  }

  const marketKey = document.getElementById("marketSelect").value;
  const cfg = getMarketConfig(marketKey);
  const dbPath = cfg.dbKey;
  const rawDate = document.getElementById("inputDate").value || getTodayString();
  const rawNumbers = document.getElementById("inputNumbers").value.trim();

  if (!rawNumbers) {
    msgEl.style.color = "#fda4af";
    msgEl.textContent = "Angka tidak boleh kosong!";
    return;
  }

  const dateParts = rawDate.split("-");
  const formattedDate = `${dateParts[2]}-${dateParts[1]}-${dateParts[0]}`;
  const ref = database.ref("live/" + dbPath);

  btnUpdate.disabled = true;
  msgEl.style.color = "#fda4af";
  msgEl.textContent = `Menyimpan data ${cfg.label}...`;

  let currentRound = 1;

  ref.once("value").then((snapshot) => {
    const existingObj = snapshot.val();
    let finalNumbers = rawNumbers;
    if (existingObj && typeof existingObj === "object" && existingObj[formattedDate]) {
      const prevData = existingObj[formattedDate];
      const prevStr = Array.isArray(prevData)
        ? prevData.join(",")
        : (typeof prevData === "string" ? prevData.trim() : "");
      if (prevStr !== "") {
        finalNumbers = prevStr + "," + rawNumbers;
      }
    }
    const items = parsePaitoItems(finalNumbers);
    currentRound = items.length > 0 ? items.length : 1;
    return ref.update({ [formattedDate]: finalNumbers });
  }).then(() => {
    const hasRoundSystem = dbPath === "data-macau4d" || dbPath === "data-macau5d";
    const roundSuffix = hasRoundSystem ? ` (putaran ke-${currentRound})` : "";
    msgEl.style.color = "#6ee7b7";
    msgEl.textContent = `Berhasil menyimpan data ${cfg.label} tgl ${formattedDate}${roundSuffix}!`;
    document.getElementById("inputNumbers").value = "";

    if (!isManualMarketSelection && hasRoundSystem) {
      const nextRound = currentRound + 1;
      const nextKey = getMacauRoundOptionKey(dbPath, nextRound);
      if (nextKey) {
        document.getElementById("marketSelect").value = nextKey;
      }
    }

    shownMissedPopupSignature = "";
    checkMissedScheduledMarkets();
    setTimeout(() => showLatestDataPaito(document.getElementById("marketSelect").value), 1200);
  }).catch((err) => {
    msgEl.style.color = "#fda4af";
    msgEl.textContent = "Gagal menyimpan: " + err.message;
  }).finally(() => {
    btnUpdate.disabled = false;
  });
}

document.addEventListener("DOMContentLoaded", () => {
  autoSetDates();
  applyInitialMarketByTime();

  let lastTrackedKey = document.getElementById("marketSelect")?.value || "";

  setInterval(() => {
    checkMissedScheduledMarkets();
    if (isManualMarketSelection) return;
    const activeMarket = getScheduledMarketByTime();
    if (activeMarket.key !== lastTrackedKey) {
      lastTrackedKey = activeMarket.key;
      syncMarketToCurrentRound(activeMarket);
    }
  }, 15000);

  document.getElementById("marketSelect")?.addEventListener("change", (e) => {
    isManualMarketSelection = true;
    lastTrackedKey = e.target.value;
    updateSelectionModeBadge();
    refreshAllFormPreviews();
  });

  ["adminEmail", "adminPassword"].forEach((id) => {
    document.getElementById(id)?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        loginAdmin();
      }
    });
  });

  firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
    firebase.auth().onAuthStateChanged((user) => {
      const overlay = document.getElementById("adminLoginOverlay");
      const statusBadge = document.getElementById("authStatusIndicator");
      const logoutBtn = document.getElementById("btnLogout");

      if (user) {
        if (overlay) overlay.style.display = "none";
        if (statusBadge) {
          statusBadge.className = "auth-status-badge status-logged-in";
          statusBadge.innerHTML = `🟢 Status : <b>LOGIN</b> (${user.email})`;
        }
        if (logoutBtn) logoutBtn.style.display = "inline-block";
        shownMissedPopupSignature = "";
        checkMissedScheduledMarkets();
        if (!isManualMarketSelection) {
          syncMarketToCurrentRound(getScheduledMarketByTime());
        }
      } else {
        if (overlay) overlay.style.display = "flex";
        if (statusBadge) {
          statusBadge.className = "auth-status-badge status-logged-out";
          statusBadge.innerHTML = "🔴 Status : <b>LOGOUT</b>";
        }
        if (logoutBtn) logoutBtn.style.display = "none";
        closeMissedMarketModal();
      }
    });
  });
});
</script>
