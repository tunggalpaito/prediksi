name: Bot Lomba Berbasis Jam Result

on:
  schedule:
    # Server menyala setiap hari jam 03:00 UTC (10:00 pagi WIB) untuk memproses semua pasaran hari itu
    - cron: '0 3 * * *'
  
  workflow_dispatch:

jobs:
  run-bot-lomba:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies (Requests)
        run: pip install requests

      - name: Jalankan Skrip Bot
        run: python bot_lomba.py
