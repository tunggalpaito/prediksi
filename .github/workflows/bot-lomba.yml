name: Bot Lomba Berbasis Jam Result

on:
  schedule:
    # Contoh: Bot menyala setiap 4 jam sekali untuk mencakup pasaran yang berbeda sepanjang hari
    - cron: '0 */4 * * *'
  
  workflow_dispatch:

jobs:
  run-bot-lomba:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies (Requests)
        run: pip install requests

      - name: Jalankan Skrip Bot
        run: python bot_lomba.py
