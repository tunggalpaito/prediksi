// SANITASI KEY EMAIL FIREBASE
function sanitizeKey(str) {
    return str.replace(/\./g, '_dot_').replace(/@/g, '_at_').replace(/[^a-zA-Z0-9_]/g, '');

async function isUserVIPActive() {
    const session = JSON.parse(sessionStorage.getItem("tp_firebase_user") || "null");
    if (!session) return false;

    try {
        const snapshot = await db.ref('users/' + session.userKey).once('value');
        const userData = snapshot.val();
        
        if (!userData) return false;
        if (userData.status !== "active") return false;

        const now = new Date().getTime();
        if (now > userData.expiry) return false;

        return true;
    } catch (err) {
        console.error("Gagal verifikasi sesi:", err);
        return false;
    }
}

async function fetchFirebaseData(){
    try{

function openAuthModal() { document.getElementById("authModalOverlay").style.display = "flex"; }

function switchTab(tab) {
    document.querySelectorAll(".auth-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".auth-form").forEach(f => f.classList.remove("active"));
    if(tab === 'login') {
        document.querySelectorAll(".auth-tab")[0].classList.add("active");
        document.getElementById("loginForm").classList.add("active");
    } else {
        document.querySelectorAll(".auth-tab")[1].classList.add("active");
        document.getElementById("registerForm").classList.add("active");
    }
}

function validatePassword(pass) {
    if (pass.length < 4) return "Sandi minimal harus 4 karakter!";
    if (!/[A-Z]/.test(pass)) return "Sandi harus mengandung minimal 1 Huruf Besar!";
    const digitMatches = pass.match(/\d/g);
    if (!digitMatches || digitMatches.length < 2) return "Sandi harus mengandung minimal 2 Angka!";
    return null;
}

// PENDAFTARAN - SIMPAN KE FIREBASE (STATUS: PENDING)
async function submitRegister() {
    const email = document.getElementById("regEmail").value.trim();
    const phone = document.getElementById("regPhone").value.trim();
    const pass = document.getElementById("regPass").value.trim();
    const source = document.getElementById("regSource").value;
    
    document.getElementById("regEmailError").textContent = "";
    document.getElementById("regPassError").textContent = "";

    if(!email || !phone || !pass) {
        alert("Semua kolom wajib diisi!");
        return;
    }

    let passError = validatePassword(pass);
    if(passError) {
        document.getElementById("regPassError").textContent = "Koreksi: " + passError;
        return;
    }

    const userKey = sanitizeKey(email);
    const userRef = db.ref('users/' + userKey);

    const snapshot = await userRef.once('value');
    if (snapshot.exists()) {
        document.getElementById("regEmailError").textContent = "Koreksi: Email ini sudah terdaftar. Silakan login atau hubungi admin.";
        return;
    }

    // SIMPAN KE FIREBASE
    await userRef.set({
        email: email,
        phone: phone,
        pass: pass,
        source: source,
        status: "pending",
        createdAt: new Date().getTime(),
        expiry: 0
    });

    closeAuthModal();
    alert("Pendaftaran Berhasil! Silakan konfirmasi pembayaran Rp 50.000 ke WhatsApp Admin agar akun diaktifkan.");

    // BUKA CHAT WA ADMIN
    const waText = encodeURIComponent(

        `*Detail Pendaftaran:*\n` +
        `- Email: ${email}\n` +
        `- No. HP: ${phone}\n` +
        `- Sumber Info: ${source}`
    );
    window.open(`https://wa.me/${ADMIN_WA}?text=${waText}`, "_blank");
}

// LOGIN - CEK DATA DARI FIREBASE
async function submitLogin() {
    const loginId = document.getElementById("loginId").value.trim();
    const pass = document.getElementById("loginPass").value.trim();
    document.getElementById("loginError").textContent = "";

    if(!loginId || !pass) {
        alert("Email/No HP dan Sandi wajib diisi!");
        return;
    }

    const usersRef = db.ref('users');
    const snapshot = await usersRef.once('value');
    const users = snapshot.val();

    let foundUserKey = null;
    let foundUser = null;

    if (users) {
        Object.keys(users).forEach(key => {
            if (users[key].email === loginId || users[key].phone === loginId) {
                foundUserKey = key;
                foundUser = users[key];
            }
        });
    }

    if (!foundUser) {
        document.getElementById("loginError").textContent = "Koreksi: Email atau Nomor HP belum terdaftar!";
        return;
    }

    if (foundUser.pass !== pass) {
        document.getElementById("loginError").textContent = "Koreksi: Kata sandi yang Anda masukkan salah!";
        return;
    }

    if (foundUser.status === "pending") {
        document.getElementById("loginError").textContent = "Koreksi: Akun Anda masih PENDING. Silakan lakukan pembayaran 50k & konfirmasi ke WA Admin.";
        return;
    }

    const now = new Date().getTime();
    if (foundUser.expiry && now > foundUser.expiry) {
        document.getElementById("loginError").textContent = "Koreksi: Masa aktif 14 hari Anda telah berakhir. Hubungi Admin WA untuk memperpanjang.";
        return;
    }

    sessionStorage.setItem("tp_firebase_user", JSON.stringify({ userKey: foundUserKey }));

    closeAuthModal();
    await fetchFirebaseData();
    alert("Login Berhasil! Result terbaru telah terbuka.");
}
