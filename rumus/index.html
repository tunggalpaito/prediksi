      animation-play-state: var(--fire-play-state, running);

    @media (min-width: 640px) {
      .fire-cta-box {

    @keyframes expandFromCenterSlow {
      0% {
        transform: translate3d(-50%, -50%, 0) scaleX(0.35) scaleY(0.75);

      }
      5% {
        transform: translate3d(-50%, -50%, 0) scaleX(0.75) scaleY(0.95);

      20% {

      }
      25% {

      }
      100% {
        transform: translate3d(-50%, -50%, 0) scaleX(1.26) scaleY(1.05);

    @keyframes slowLightWave {

        opacity: 0.55;

        opacity: 0.9;

  <script>
  (function() {
    "use strict";

    const yearEl = document.getElementById("currentYear");
    if (yearEl) {
      yearEl.textContent = String(new Date().getFullYear());
    }

    const FIREBASE_DB_CONFIG = {
      databaseURL: window.TP_FIREBASE_DB_URL || "https://komentar-web-f9e2e-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    const FIREBASE_BO_PATH = "live/bo-rekomendasi";
    const DEFAULT_BO_LINK = "https://indo200-live.com/register?r=2oajlu";
    const STORAGE_CLICKED_BO_KEY = "tp_clicked_bo_links_v1";
    const promoBoxEl = document.getElementById("fire-promo-box");
    const promoAnchorEl = document.getElementById("fire-promo-link");
    const boImgBannerEls = Array.from(document.querySelectorAll("[data-bo-img-banner]"));

    let boLinksList = [DEFAULT_BO_LINK];
    let currentActiveBoLink = DEFAULT_BO_LINK;
    let isFireBoxInViewport = true;

    function isSafeHttpUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== "string") return false;
      try {
        const parsed = new URL(rawUrl.trim(), window.location.href);
        return parsed.protocol === "https:" || parsed.protocol === "http:";
      } catch (_) {
        return false;
      }
    }

    function readClickedBoLinks() {
      try {
        const raw = window.localStorage.getItem(STORAGE_CLICKED_BO_KEY);
        const parsed = JSON.parse(raw || "[]");
        if (!Array.isArray(parsed)) return [];
        return parsed.filter(function(u) { return isSafeHttpUrl(u); }).map(function(u) { return u.trim(); });
      } catch (_) {
        return [];
      }
    }

    function saveClickedBoLink(url) {
      if (!isSafeHttpUrl(url)) return;
      const clean = url.trim();
      const list = readClickedBoLinks();
      if (!list.includes(clean)) {
        list.push(clean);
        try {
          window.localStorage.setItem(STORAGE_CLICKED_BO_KEY, JSON.stringify(list));
        } catch (_) {}
      }
    }

    function extractUrlsFromFirebaseValue(val) {
      const found = [];
      const seen = new Set();

      function pushUrl(candidate) {
        if (typeof candidate === "string") {
          const cleaned = candidate.trim();
          if (isSafeHttpUrl(cleaned) && !seen.has(cleaned)) {
            seen.add(cleaned);
            found.push(cleaned);
          }
        } else if (candidate && typeof candidate === "object") {
          if (typeof candidate.url === "string") pushUrl(candidate.url);
          else if (typeof candidate.link === "string") pushUrl(candidate.link);
          else if (typeof candidate.href === "string") pushUrl(candidate.href);
        }
      }

      if (Array.isArray(val)) {
        val.forEach(pushUrl);
      } else if (val && typeof val === "object") {
        if (Array.isArray(val.links)) val.links.forEach(pushUrl);
        if (Array.isArray(val.list)) val.list.forEach(pushUrl);
        if (Array.isArray(val.items)) val.items.forEach(pushUrl);
        Object.keys(val).forEach(function(k) {
          if (k !== "links" && k !== "list" && k !== "items") {
            pushUrl(val[k]);
          }
        });
      } else if (typeof val === "string") {
        val.split(/[\n,]+/).forEach(pushUrl);
      }

      return found;
    }

    function pickNextUnclickedBoLink(excludeCurrent) {
      if (!Array.isArray(boLinksList) || !boLinksList.length) return DEFAULT_BO_LINK;
      if (boLinksList.length === 1) {
        return isSafeHttpUrl(boLinksList[0]) ? boLinksList[0].trim() : DEFAULT_BO_LINK;
      }

      const clickedSet = new Set(readClickedBoLinks());
      let unclicked = boLinksList.filter(function(u) {
        return !clickedSet.has(u.trim());
      });

      if (!unclicked.length) {
        try {
          window.localStorage.removeItem(STORAGE_CLICKED_BO_KEY);
        } catch (_) {}
        unclicked = boLinksList.slice();
      }

      let candidates = unclicked;
      if (excludeCurrent && unclicked.length > 1) {
        const withoutCurrent = unclicked.filter(function(u) {
          return u.trim() !== excludeCurrent.trim();
        });
        if (withoutCurrent.length) candidates = withoutCurrent;
      }

      const chosen = candidates[Math.floor(Math.random() * candidates.length)];
      return isSafeHttpUrl(chosen) ? chosen.trim() : DEFAULT_BO_LINK;
    }

    function getActiveBoLink() {
      if (!isSafeHttpUrl(currentActiveBoLink) || !boLinksList.includes(currentActiveBoLink.trim())) {
        currentActiveBoLink = pickNextUnclickedBoLink("");
      }
      return currentActiveBoLink;
    }

    function syncBoImageBanners() {
      const primaryLink = getActiveBoLink();
      boImgBannerEls.forEach(function(bannerEl, idx) {
        const linkForSlot = boLinksList.length > 1
          ? boLinksList[idx % boLinksList.length]
          : primaryLink;
        const safeHref = isSafeHttpUrl(linkForSlot) ? linkForSlot.trim() : DEFAULT_BO_LINK;
        bannerEl.setAttribute("href", safeHref);
      });
    }

    function applyCurrentBoLinkToPromo() {
      if (promoAnchorEl) {
        promoAnchorEl.setAttribute("href", getActiveBoLink());
      }
      syncBoImageBanners();
    }

    function rotateBoLink() {
      currentActiveBoLink = pickNextUnclickedBoLink(currentActiveBoLink);
      applyCurrentBoLinkToPromo();
    }

    function updateBoLinksFromData(rawData) {
      const extracted = extractUrlsFromFirebaseValue(rawData);
      boLinksList = extracted.length ? extracted : [DEFAULT_BO_LINK];
      currentActiveBoLink = pickNextUnclickedBoLink("");
      applyCurrentBoLinkToPromo();
    }

    function applyFirePlayState() {
      if (!promoBoxEl) return;
      const sentences = promoBoxEl.querySelectorAll(".fire-sentence");
      const nextState = (!document.hidden && isFireBoxInViewport) ? "running" : "paused";
      promoBoxEl.style.setProperty("--fire-play-state", nextState);
      sentences.forEach(function(item) {
        item.style.animationPlayState = nextState;
      });
    }

    function refreshFireMarqueeState() {
      applyFirePlayState();
      if (!document.hidden && isFireBoxInViewport && promoBoxEl) {
        const sentences = promoBoxEl.querySelectorAll(".fire-sentence");
        sentences.forEach(function(item) {
          item.style.animation = "none";
          void item.offsetWidth;
          item.style.animation = "";
          item.style.animationPlayState = "running";
        });
      }
    }

    if (promoBoxEl && "IntersectionObserver" in window) {
      const io = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          isFireBoxInViewport = Boolean(entry.isIntersecting);
          applyFirePlayState();
        });
      }, { root: null, rootMargin: "20px 0px", threshold: 0.01 });
      io.observe(promoBoxEl);
    }

    if (promoAnchorEl) {
      promoAnchorEl.addEventListener("pointerdown", function() {
        applyCurrentBoLinkToPromo();
      }, { passive: true });
      promoAnchorEl.addEventListener("click", function() {
        const clickedHref = promoAnchorEl.getAttribute("href") || getActiveBoLink();
        saveClickedBoLink(clickedHref);
        currentActiveBoLink = pickNextUnclickedBoLink(clickedHref);
        applyCurrentBoLinkToPromo();
      });
    }

    boImgBannerEls.forEach(function(bannerEl) {
      bannerEl.addEventListener("click", function() {
        const clickedHref = bannerEl.getAttribute("href") || getActiveBoLink();
        saveClickedBoLink(clickedHref);
        currentActiveBoLink = pickNextUnclickedBoLink(clickedHref);
        applyCurrentBoLinkToPromo();
      });
    });

    currentActiveBoLink = pickNextUnclickedBoLink("");
    applyCurrentBoLinkToPromo();

    let boCycleTimer = null;
    function startBoLinkCycle() {
      if (boCycleTimer || document.hidden) return;
      boCycleTimer = setInterval(function() {
        if (!document.hidden) rotateBoLink();
      }, 4000);
    }
    function stopBoLinkCycle() {
      if (boCycleTimer) {
        clearInterval(boCycleTimer);
        boCycleTimer = null;
      }
    }

    const dbUrl = String(FIREBASE_DB_CONFIG.databaseURL || "").trim().replace(/\/+$/, "");
    const restUrl = (dbUrl && isSafeHttpUrl(dbUrl)) ? (dbUrl + "/" + FIREBASE_BO_PATH + ".json") : "";

    function fetchRestBoLinks() {
      if (!restUrl || typeof fetch !== "function") return;
      fetch(restUrl + "?t=" + Date.now(), { cache: "no-store" })
        .then(function(res) { return res.ok ? res.json() : null; })
        .then(function(data) {
          if (data !== null) updateBoLinksFromData(data);
        })
        .catch(function() {});
    }

    function attachSdkRealtime(dbApp) {
      try {
        if (dbApp && typeof dbApp.ref === "function") {
          dbApp.ref(FIREBASE_BO_PATH).on("value", function(snap) {
            updateBoLinksFromData(snap && typeof snap.val === "function" ? snap.val() : null);
          });
          return true;
        }
      } catch (_) {}
      return false;
    }

    function initFirebaseBoListener() {
      if (!restUrl) return;
      if (window.firebase && typeof window.firebase.database === "function") {
        try {
          const app = window.firebase.apps && window.firebase.apps.length
            ? window.firebase.app()
            : window.firebase.initializeApp({ databaseURL: dbUrl });
          if (attachSdkRealtime(window.firebase.database(app))) return;
        } catch (_) {}
      }

      fetchRestBoLinks();

      if (document.getElementById("tp-fb-app-sdk") || document.getElementById("tp-fb-db-sdk")) return;
      const appScript = document.createElement("script");
      appScript.id = "tp-fb-app-sdk";
      appScript.async = true;
      appScript.src = "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js";
      appScript.onerror = function() { fetchRestBoLinks(); };
      appScript.onload = function() {
        const dbScript = document.createElement("script");
        dbScript.id = "tp-fb-db-sdk";
        dbScript.async = true;
        dbScript.src = "https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js";
        dbScript.onerror = function() { fetchRestBoLinks(); };
        dbScript.onload = function() {
          try {
            const app = window.firebase.apps && window.firebase.apps.length
              ? window.firebase.app()
              : window.firebase.initializeApp({ databaseURL: dbUrl });
            attachSdkRealtime(window.firebase.database(app));
          } catch (_) {
            fetchRestBoLinks();
          }
        };
        document.head.appendChild(dbScript);
      };
      document.head.appendChild(appScript);
    }

    startBoLinkCycle();

    const TOP_468_BANNERS = [
      {
        slotId: "slot-banner-468-1",
        scriptId: "ad-script-468-1",
        key: "9a986a45c62dcea8d8216b9210f159cb",
        src: "https://brijmohan.org/22/9a986a45c62dcea8d8216b9210f159cb"
      }
    ];

    const top468WrapperEl = document.getElementById("ad-slots-wrapper");
    const top468SlotEls = TOP_468_BANNERS.map(function(cfg) {
      return document.getElementById(cfg.slotId);
    }).filter(Boolean);

    function syncTop468WrapperVisibility() {
      if (!top468WrapperEl) return;
      top468WrapperEl.style.display = "flex";
    }

    function fitSingle468Slot(slotEl) {
      if (!slotEl) return;
      slotEl.style.display = "flex";
      slotEl.style.visibility = "visible";
      slotEl.style.opacity = "1";

      const availW = Math.max(0, slotEl.clientWidth - 8);
      const iframes = slotEl.querySelectorAll("iframe");
      if (!iframes.length) {
        slotEl.style.height = "68px";
        return;
      }

      iframes.forEach(function(iframe) {
        const attrW = parseFloat(iframe.getAttribute("width") || "468") || 468;
        const attrH = parseFloat(iframe.getAttribute("height") || "60") || 60;
        const ratio = (availW > 0 && attrW > availW) ? (availW / attrW) : 1;
        const scaledW = attrW * ratio;
        const scaledH = Math.round(attrH * ratio);

        iframe.style.position = "relative";
        iframe.style.left = "50%";
        iframe.style.top = "0";
        iframe.style.width = attrW + "px";
        iframe.style.height = attrH + "px";
        iframe.style.maxWidth = "none";
        iframe.style.maxHeight = "none";
        iframe.style.margin = "0";
        iframe.style.background = "transparent";
        iframe.style.transformOrigin = "top center";
        iframe.style.transform = "translate3d(-50%, 0, 0) scale(" + ratio.toFixed(4) + ")";
        iframe.style.marginLeft = "-" + (scaledW / 2).toFixed(2) + "px";
        iframe.style.marginRight = "-" + (scaledW / 2).toFixed(2) + "px";
        iframe.style.marginBottom = "-" + Math.max(0, attrH - scaledH) + "px";

        slotEl.style.height = Math.max(68, scaledH + 8) + "px";
      });
    }

    function fitAllTop468Banners() {
      top468SlotEls.forEach(fitSingle468Slot);
      syncTop468WrapperVisibility();
    }

    function observeSlotForIframe(slotEl) {
      if (!slotEl || slotEl.dataset.obsAttached === "1") return;
      slotEl.dataset.obsAttached = "1";

      if ("MutationObserver" in window) {
        const mo = new MutationObserver(function() {
          fitSingle468Slot(slotEl);
          syncTop468WrapperVisibility();
        });
        mo.observe(slotEl, { childList: true, subtree: true });
      }

      let checks = 0;
      const poll = setInterval(function() {
        checks += 1;
        fitSingle468Slot(slotEl);
        syncTop468WrapperVisibility();
        if (slotEl.querySelector("iframe") || checks >= 24) {
          clearInterval(poll);
        }
      }, 250);
    }

    function loadSingle468Banner(cfg) {
      return new Promise(function(resolve) {
        const slotEl = document.getElementById(cfg.slotId);
        if (!slotEl) {
          resolve();
          return;
        }
        observeSlotForIframe(slotEl);

        if (slotEl.dataset.adLoaded === "1") {
          fitSingle468Slot(slotEl);
          resolve();
          return;
        }
        slotEl.dataset.adLoaded = "1";

        window.atOptions = {
          key: cfg.key,
          format: "iframe",
          height: 60,
          width: 468,
          params: {}
        };

        const sc = document.createElement("script");
        sc.id = cfg.scriptId;
        sc.async = false;
        sc.setAttribute("data-cfasync", "false");
        sc.referrerPolicy = "strict-origin-when-cross-origin";
        sc.src = cfg.src;

        let finished = false;
        function done() {
          if (finished) return;
          finished = true;
          fitSingle468Slot(slotEl);
          syncTop468WrapperVisibility();
          setTimeout(function() {
            fitSingle468Slot(slotEl);
            syncTop468WrapperVisibility();
            resolve();
          }, 1200);
        }

        sc.addEventListener("load", done, { once: true });
        sc.addEventListener("error", done, { once: true });
        setTimeout(done, 2400);
        slotEl.appendChild(sc);
      });
    }

    function loadAllTop468Banners() {
      syncTop468WrapperVisibility();
      return TOP_468_BANNERS.reduce(function(chain, cfg) {
        return chain.then(function() {
          return loadSingle468Banner(cfg);
        });
      }, Promise.resolve());
    }

    const adSlots = [
      document.getElementById("adSlot1"),
      document.getElementById("adSlot2"),
      document.getElementById("adSlot3"),
      document.getElementById("adSlot4")
    ].filter(Boolean);

    function fitIframeToSlot(slotEl) {
      if (!slotEl) return;
      const iframe = slotEl.querySelector("iframe");
      if (!iframe) return;

      const slotWidth = slotEl.clientWidth;
      const iframeWidth = parseInt(iframe.getAttribute("width"), 10) || 320;
      const iframeHeight = parseInt(iframe.getAttribute("height"), 10) || 50;

      if (slotWidth > 0 && iframeWidth > 0) {
        const scale = slotWidth / iframeWidth;
        iframe.style.width = iframeWidth + "px";
        iframe.style.height = iframeHeight + "px";
        iframe.style.transformOrigin = "top left";
        iframe.style.transform = "scale(" + scale + ")";
        const lockedHeight = Math.round(iframeHeight * scale);
        slotEl.style.height = lockedHeight + "px";
      }
    }

    function fitAllAdSlots() {
      fitAllTop468Banners();
      adSlots.forEach(fitIframeToSlot);
    }

    function loadBannersSequentially(index) {
      if (index >= adSlots.length) {
        fitAllAdSlots();
        return;
      }
      const box = adSlots[index];
      if (!box) {
        loadBannersSequentially(index + 1);
        return;
      }
      if (box.dataset.adLoaded === "1") {
        fitIframeToSlot(box);
        loadBannersSequentially(index + 1);
        return;
      }
      box.dataset.adLoaded = "1";

      window.atOptions = {
        key: "119c8bb3217ed264a8fa223c3197bf69",
        format: "iframe",
        height: 50,
        width: 320,
        params: {}
      };

      const scriptEl = document.createElement("script");
      scriptEl.async = false;
      scriptEl.src = "https://crypotential.com/119c8bb3217ed264a8fa223c3197bf69/invoke.js";

      let movedNext = false;
      function nextSlot() {
        fitIframeToSlot(box);
        if (movedNext) return;
        movedNext = true;
        setTimeout(function() {
          fitIframeToSlot(box);
          loadBannersSequentially(index + 1);
        }, 180);
      }

      scriptEl.addEventListener("load", nextSlot, { once: true });
      scriptEl.addEventListener("error", nextSlot, { once: true });
      box.appendChild(scriptEl);
      setTimeout(function() { fitIframeToSlot(box); }, 500);
      setTimeout(nextSlot, 1400);
    }

    window.addEventListener("resize", fitAllAdSlots, { passive: true });

    function onPageReady() {
      loadAllTop468Banners().then(function() {
        loadBannersSequentially(0);
      });
      initFirebaseBoListener();
    }

    if (document.readyState === "complete") {
      onPageReady();
    } else {
      window.addEventListener("load", onPageReady, { once: true });
    }

    const fbPollTimer = setInterval(function() {
      if (!document.hidden) fetchRestBoLinks();
    }, 30000);

    document.addEventListener("visibilitychange", function() {
      if (document.hidden) {
        stopBoLinkCycle();
        applyFirePlayState();
      } else {
        startBoLinkCycle();
        refreshFireMarqueeState();
        fitAllAdSlots();
      }
    });

    window.addEventListener("focus", refreshFireMarqueeState, { passive: true });
    window.addEventListener("pageshow", function() {
      applyCurrentBoLinkToPromo();
      startBoLinkCycle();
      refreshFireMarqueeState();
      fitAllAdSlots();
    }, { passive: true });

    window.addEventListener("pagehide", function() {
      clearInterval(fbPollTimer);
      stopBoLinkCycle();
    }, { passive: true });
  })();
  </script>
