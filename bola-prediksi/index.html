<style>body{background:#000;color:#fff;font-family:Arial,sans-serif;padding:15px;display:flex;flex-direction:column;align-items:center}button,input[type=date],select,textarea{width:100%;max-width:360px;padding:10px;margin:5px 0;border:1px solid #fff;border-radius:8px;box-sizing:border-box;box-shadow:0 0 8px rgba(255,255,255,.3)}button{background:#fc0;color:#000;font-weight:700;cursor:pointer;border:none}textarea{height:160px;background:#000;color:#fff}input[type=date]{background:#000;color:#fff;border:1px solid #fff;font-size:14px;text-align:center;font-weight:700}select{background:#000;color:#fff}#capture{width:100%;max-width:480px;padding:20px;text-align:center;border-radius:16px;background:#000;border:2px solid #fff;box-shadow:0 0 15px #fff,0 0 30px rgba(255,255,255,.8),inset 0 0 10px rgba(255,255,255,.2);transition:background .3s ease,box-shadow .3s ease;margin-top:10px}.row{background:#000;padding:6px 6px;margin:8px 0;border-radius:10px;display:flex;justify-content:center;align-items:center;gap:2px;flex-wrap:nowrap;overflow-x:auto;max-width:100%;border:1px solid rgba(255,255,255,.2)}.row::-webkit-scrollbar{height:3px}.row::-webkit-scrollbar-thumb{background:#333;border-radius:3px}.ball{width:24px;height:24px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:15px;font-weight:900;flex-shrink:0}.ball.bbfs-ball{width:18px;height:18px;font-size:11px}.red{background:red;color:#fff}.white{background:#fff;color:#000}.colon{font-size:20px;font-weight:700;margin:0 2px;flex-shrink:0}.colon.bbfs-colon{font-size:14px;margin:0 1px}.vs-3d{font-size:14px;font-weight:900;font-style:italic;margin:0 4px;background:linear-gradient(180deg,#ffe600 0,#f80 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 1px 0 #950,0 2px 0 #730,0 2px 4px rgba(0,0,0,.8),0 0 6px rgba(255,200,0,.8);letter-spacing:.5px;display:inline-block;transform:skewX(-10deg);flex-shrink:0}#tanggal{display:block;width:fit-content;min-width:260px;max- <script>function setTodayCalendar(){let e=new Date,t=e.getFullYear(),n=String(e.getMonth()+1).padStart(2,"0"),l=String(e.getDate()).padStart(2,"0");document.getElementById("inputCalendar").value=`${t}-${n}-${l}`,formatTanggalKalender()}function formatTanggalKalender(){let e=document.getElementById("inputCalendar").value;if(!e)return;let t=e.split("-"),n=new Date(t[0],t[1]-1,t[2]).toLocaleDateString("id-ID",{weekday:"long",year:"numeric",month:"long",day:"numeric"});document.getElementById("tanggal").value=n}function updateTitleAndFlag(){let e=document.getElementById("flag"),t=e.options[e.selectedIndex],n=t.value,l=t.getAttribute("data-name"),a=t.getAttribute("data-bg");document.getElementById("bendera").innerText=n,document.getElementById("capture").style.background=a;let i=document.getElementById("input").value.trim(),d=i.split("\n").filter((e=>""!==e.trim()));if(0===d.length)return void(document.getElementById("titleText").innerText="PREDIKSI "+l+" HARI INI");let r=d.some((e=>e.includes("vs"))),s=d.some((e=>!e.includes("vs")&&(!!e.includes(":")&&(e.split(":")[1]||"").replace(/\s+/g,"").length>=5))),o=!i.includes(":")&&!i.includes("vs");document.getElementById("titleText").innerText=r||o?"LINE 2D "+l+" HARI INI":s?"PREDIKSI BBFS "+l+" HARI INI":"PREDIKSI "+l+" HARI INI"}setTodayCalendar(),updateTitleAndFlag();let data=[];function makeBalls(e,t,n){let l="";const a=[...e];let i=n?`ball ${t} bbfs-ball`:`ball ${t}`;for(let e=0;e<a.length;e++){let t=a[e];"̶"===a[e+1]&&(t+=a[e+1],e++),l+=`<div class="${i}">${t}</div>`}return l}function ambilDigit(e,t){let n="",l=0,a=t||e.length;for(let t=0;t<e.length&&(n+=e[t],/[0-9]/.test(e[t])&&l++,"̶"===e[t+1]&&(n+=e[t+1],t++),!(l>=a));t++);return n}function generate(){let e=document.getElementById("input").value.split("\n").filter((e=>""!==e.trim()));data=e.map((e=>{let t=e.trim();if(t.includes("vs")){let e=t.split(":"),n=(e[0]||"").replace(/\s+/g,""),l=(e[1]||"").split("vs"),a=(l[0]||"").replace(/\s+/g,""),i=(l[1]||"").replace(/\s+/g,"");return{type:"vs_format",red:ambilDigit(n),white1:ambilDigit(a),white2:ambilDigit(i)}}if(t.includes(":")){let e=t.split(":"),n=(e[0]||"").replace(/\s+/g,""),l=(e[1]||"").replace(/\s+/g,"");return{type:l.length>=5?"bbfs":"paito",red:ambilDigit(n),white:ambilDigit(l)}}let n=t.replace(/\s+/g,"");return{type:"line2d",red:ambilDigit(n,n.length)}})),updateTitleAndFlag(),render()}function render(){let e="";data.forEach((t=>{"line2d"===t.type?e+=`\n<div class="row">\n${makeBalls(t.red,"red",!1)}\n</div>\n`:"paito"===t.type?e+=`\n<div class="row">\n${makeBalls(t.red,"red",!1)}\n<div class="colon">:</div>\n${makeBalls(t.white,"white",!1)}\n</div>\n`:"vs_format"===t.type?e+=`\n<div class="row">\n${makeBalls(t.red,"red",!1)}\n<div class="colon">:</div>\n${makeBalls(t.white1,"white",!1)}\n<span class="vs-3d">VS</span>\n${makeBalls(t.white2,"white",!1)}\n</div>\n`:e+=`\n<div class="row">\n${makeBalls(t.red,"red",!0)}\n<div class="colon bbfs-colon">:</div>\n${makeBalls(t.white,"white",!0)}\n</div>\n`})),document.getElementById("output").innerHTML=e}function resetData(){document.getElementById("input").value="",document.getElementById("output").innerHTML="",updateTitleAndFlag()}function downloadImage(){let e=document.getElementById("flag"),t=(e.options[e.selectedIndex].getAttribute("data-market")||"hk").toLowerCase(),n=document.getElementById("tanggal").value.trim().toLowerCase().replace(/[\/,]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-"),l="prediksi";document.getElementById("input").value.trim().includes("vs")&&(l="bbfs-2d");let a=`${l}-${t}-${n}.png`;html2canvas(document.getElementById("capture"),{backgroundColor:"#000000",scale:2,useCORS:!0}).then((function(e){let t=document.createElement("a");t.download=a,t.href=e.toDataURL("image/png"),t.click()}))}</script>
