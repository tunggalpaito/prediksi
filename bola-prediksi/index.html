<!doctype html>

<style>
body{background:#000;color:#fff;font-family:Arial,sans-serif;padding:15px;display:flex;flex-direction:column;align-items:center}

/* Container Capture */

/* Tampilan Khusus Format Kupon 2D (Sesuai Gambar) */
#capture.mode-kupon {
    background: #00ff00 !important;
    border: 5px solid #00bb00 !important;
    box-shadow: none !important;
    color: #000 !important;
}
#capture.mode-kupon h2 {
    color: #000 !important;
    text-shadow: none !important;
    font-size: 2em;
    font-weight: 900;
    margin-bottom: 2px;
}
#capture.mode-kupon .togel-table {
    background: #fff;
    color: #000;
    border: 2px solid #000;
    margin-top: 10px;
    box-shadow: none;
}
#capture.mode-kupon .togel-table th {
    background: #000;
    color: #fff;
    font-size: 15px;
    font-weight: 900;
    text-shadow: none;
    border: 1px solid #000;
}
#capture.mode-kupon .togel-table td {
    border: 1px solid #000;
    padding: 4px;
    font-weight: 800;
}
#capture.mode-kupon .col-no {
    color: #000;
    font-size: 16px;
    font-weight: 900;
}
/* Header ANGKA diubah jadi putih dan ukuran disesuaikan */
#capture.mode-kupon th.col-angka {
    font-size: 15px !important;
    color: #fff !important;
    font-weight: 900;
    text-shadow: none !important;
}
/* Isi angka (data) tetap biru */
#capture.mode-kupon td.col-angka {
    font-size: 22px !important;
    color: #0000ff !important;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: none !important;
}
#capture.mode-kupon .col-nominal {
    font-size: 15px;
    color: #000;
    font-weight: 800;
    text-shadow: none !important;
}
#capture.mode-kupon .nominal-wrapper {
    color: #000;
    font-weight: 800;
}
#capture.mode-kupon .total-box {
    background: #fff;
    border: 2px solid #000;
    color: #000;
    border-radius: 0;
    box-shadow: none;
    margin-top: -2px;
}
#capture.mode-kupon .total-value {
    color: #0000ff;
    font-size: 1.3em;
    font-weight: 900;
    text-shadow: none !important;
}
#capture.mode-kupon .slogan-kupon {
    font-weight: 900;
    color: #000;
    font-size: 14px;
    margin: 10px 0 5px 0;
}

/* Style Bawaan Prediksi Bola/Paito */
.row{background:#000;padding:8px 14px;margin:8px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:nowrap;overflow-x:auto;max-width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.2);position:relative;z-index:2}.row.row-center{justify-content:center}.row::-webkit-scrollbar{height:3px}.row::-webkit-scrollbar-thumb{background:#555;border-radius:3px}.row-content{display:flex;align-items:center;justify-content:center;gap:4px}.row.row-vs{justify-content:center;gap:2px;overflow:hidden}.row.row-vs .row-content{gap:2px;flex-wrap:nowrap;width:100%;overflow:hidden}.row.row-vs .ball{width:22px;height:22px;font-size:11px}.row.row-vs .ball.bbfs-ball{width:20px;height:20px;font-size:10px}.row.row-vs .colon{font-size:14px;margin:0 1px}.row.row-vs .vs-3d{font-size:11px;margin:0 2px}.ball{width:34px;height:34px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:18px;font-weight:900;flex-shrink:0;box-sizing:border-box}.ball.bbfs-ball{width:26px;height:26px;font-size:14px}.ball.line2d-ball{width:30px;height:30px;font-size:15px;background:#333;color:#fff;border:1px solid #777;box-sizing:border-box}.red{background:red;color:#fff;box-shadow:0 0 8px rgba(255,0,0,.9)}.white{background:#fff;color:#000;box-shadow:0 0 8px rgba(255,255,255,.7)}.colon{font-size:22px;font-weight:700;margin:0 4px;flex-shrink:0}.colon.bbfs-colon{font-size:16px;margin:0 2px}.star-sep{font-size:16px;font-weight:700;color:#f33;margin:0 2px;flex-shrink:0}.vs-3d{font-size:16px;font-weight:900;font-style:italic;margin:0 6px;background:linear-gradient(180deg,#ffe600 0,#f80 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 1px 0 #950,0 2px 0 #730,0 2px 4px rgba(0,0,0,.8),0 0 6px rgba(255,200,0,.8);letter-spacing:.5px;display:inline-block;transform:skewX(-10deg);flex-shrink:0}.status-badge{margin-left:0;flex:1;min-width:90px;height:28px;display:flex;justify-content:center;align-items:center;t idth:40%;font-size:13px;font-weight:700;color:#fc0;text-shadow:0 0 5px rgba(255,204,0,.5)}.nominal-wrapper{display:flex;justify-content:space-between;padding:0 12px;color:#fff}.total-box{display:flex;justify-content:space-between;align-items:center;background:#111;border:2px solid #fff;padding:8px 12px;font-weight:900;font-size:1em;color:#fff;margin-bottom:10px;border-radius:8px;box-shadow:0 0 8px rgba(255,255,255,.3);position:relative;z-index:2}.total-value{color:#00e5ff;font-size:1.1em;letter-spacing:1px;text-shadow:0 0 6px rgba(0,229,255,.6)}.promo-apk{margin-top:15px;font-size:11px;font-weight:700;color:#00e5ff;text-shadow:0 0 5px rgba(0,229,255,.6);line-height:1.3;position:relative;z-index:2}.footer{margin-top:6px;font-size:15px;font-weight:900;letter-spacing:1px;background:linear-gradient(180deg,#66d9ff 0,#0080ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 1px 0 #036,0 2px 0 #024,0 3px 6px rgba(0,0,0,.9),0 0 10px rgba(0,162,255,.8);opacity:1;position:relative;z-index:2}.neon-green{background:#333!important;color:#fff!important;border:3px solid #0f0!important;box-shadow:none!important}
</style>
</head>
<body>
<select id=flag onchange=updateTitleAndFlag()>
<option value=🇳🇿 data-name=SDY data-market=sdy data-bg=#000000>🇳🇿 SDY POOLS</option>
<option value=🇸🇬 data-name=SGP data-market=sgp data-bg=#000000>🇸🇬 SGP</option>
<option value=🇭🇰 data-name=HK data-market=hk data-bg=#000000>🇭🇰 HK POOLS</option>
<option value=🇳🇿 data-name="SDY LOTTO" data-market=sdylotto data-bg=#000000>🇳🇿 SDY LOTTO</option>
<option value=🇭🇰 data-name="HK LOTTO" data-market=hklotto data-bg=#000000>🇳🇿 HK LOTTO</option>
</select>
<input type=date id=inputCalendar onchange=formatTanggalKalender()>
<textarea id=input placeholder="Format Bola (Ada titik dua ':' atau 'vs'):
9804 : 94
3184 : 34

Atau Format Kupon Nominal (Angka ke bawah):
02
04
06, (koma untuk nominal 10.000)"></textarea>
<button onclick=generate()>✔ Proses</button>
<button onclick=resetData()>🔄 Reset</button>
<button onclick=downloadImage()>📥 Download Gambar</button>

<div id=capture>
<svg id=lineSvg style=position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1></svg>
<div class=logo-container id="logoContainer">
<img src=https://tunggalpaito.online/logo.png alt="Logo Icha" crossorigin=anonymous>
</div>
<h2 id=titleText contenteditable=true>PREDIKSI SDY HARI INI</h2>
<input id=tanggal placeholder="Hari dan tanggal bisa diubah manual">
<div id=bendera style="font-size:30px;margin:8px 0;position:relative;z-index:2"></div>
<div id=output></div>
<div class=promo-apk id="promoBox"><br>Live Draw, Paito Warna, Mesin Prediksi<br>perlengkapan musuh bandar dll tersedia di 1 aplikasi<br>(Download Di Menu Utama)</div>
<div class=footer id="footerBox">© TUNGGAL PAITO</div>
</div>
<script>
function setTodayCalendar(){let e=new Date,t=e.getFullYear(),n=String(e.getMonth()+1).padStart(2,"0"),l=String(e.getDate()).padStart(2,"0");document.getElementById("inputCalendar").value=`${t}-${n}-${l}`,formatTanggalKalender()}

function formatTanggalKalender(){let e=document.getElementById("inputCalendar").value;if(!e)return;let t=e.split("-"),n=new Date(t[0],t[1]-1,t[2]).toLocaleDateString("id-ID",{weekday:"long",year:"numeric",month:"long",day:"numeric"});document.getElementById("tanggal").value=n}

function updateTitleAndFlag(){
    let e=document.getElementById("flag"),t=e.options[e.selectedIndex],n=t.value,l=t.getAttribute("data-name"),a=t.getAttribute("data-bg");
    document.getElementById("bendera").innerText=n;
    let captureEl=document.getElementById("capture");
    if(!captureEl.classList.contains("mode-kupon")){
        captureEl.style.background=a;
    }
    let i=document.getElementById("input").value.trim(),r=i.split("\n").filter((e=>""!==e.trim()));
    if(0===r.length)return void(document.getElementById("titleText").innerText="PREDIKSI "+l+" HARI INI");
    let d=!i.includes(":")&&!i.includes("vs");
    document.getElementById("titleText").innerText=d?l:"PREDIKSI "+l+" HARI INI"
}

let data=[];

function makeBalls(e,t,n){let l="";const a=[...e];let i=n?`ball ${t} bbfs-ball`:`ball ${t}`;for(let e=0;e<a.length;e++){let t=a[e];"̶"===a[e+1]&&(t+=a[e+1],e++),l+=`<div class="${i}">${t}</div>`}return l}

function formatRupiah(e){return e.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".")}

function generate(){
    let e=document.getElementById("input").value.trim();
    let captureEl=document.getElementById("capture");
    document.getElementById("lineSvg").innerHTML="";
    
    if(!e){
        data=[];
        captureEl.classList.remove("mode-kupon");
        document.getElementById("tanggal").style.display="block";
        document.getElementById("bendera").style.display="block";
        document.getElementById("promoBox").style.display="block";
        document.getElementById("footerBox").style.display="block";
        updateTitleAndFlag();
        return void(document.getElementById("output").innerHTML="");
    }

    /* FORMAT KUPON NOMINAL / LINE 2D */
    if(!e.includes(":")&&!e.includes("vs")){
        captureEl.classList.add("mode-kupon");
        /* Sembunyikan tanggal atas, bendera, promo, dan footer bawaan */
        document.getElementById("tanggal").style.display="none";
        document.getElementById("bendera").style.display="none";
        document.getElementById("promoBox").style.display="none";
        document.getElementById("footerBox").style.display="none";

            l+=`

                    <td class="col-no">${t+1}.</td>
                    <td class="col-angka">${i}</td>
                    <td class="col-nominal">
                        <div class="nominal-wrapper">
                            <span>x</span>
                            <span>${formatRupiah(r)}</span>
                        </div>
                    </td>
                </tr>
            `
        }));
        
        let tglValue = document.getElementById("tanggal").value;
        document.getElementById("output").innerHTML=`
            <div style="font-weight:900; margin-bottom:8px; font-size: 15px;">TANGGAL : ${tglValue}</div>
            <table class="togel-table">
                <thead>
                    <tr>
                        <th class="col-no">NO.</th>
                        <th class="col-angka">ANGKA</th>
                        <th class="col-nominal">NOMINAL</th>
                    </tr>
                </thead>
                <tbody>${l}</tbody>
            </table>
            <div class="total-box">
                <span>TOTAL :</span>
                <span class="total-value">${formatRupiah(n)}</span>
            </div>
            <div class="slogan-kupon">😎 : satu hati satu hoki</div>
        `;
        updateTitleAndFlag();
        return;
    }

    /* FORMAT PREDIKSI PAITO / BOLA */
    captureEl.classList.remove("mode-kupon");
    document.getElementById("tanggal").style.display="block";
    document.getElementById("bendera").style.display="block";
    document.getElementById("promoBox").style.display="block";
    document.getElementById("footerBox").style.display="block";

    let t=e.split("\n").filter((e=>""!==e.trim())),n=t.map(((e,t)=>{let n=e.trim();if(n.includes("vs")){let e=n.split(":"),t=(e[0]||"").replace(/\s+/g,""),l=(e[1]||"").split("vs"),a=(l[0]||"").replace(/\s+/g,""),i=(l[1]||"").replace(/\s+/g,"");return{type:"vs_format",red:ambilDigit(t),white1:ambilDigit(a),white2:ambilDigit(i),rawRight:a+i}}if(n.includes(":")){let e=n.split(":"),t=(e[0]||"").replace(/\s+/g,""),l=(e[1]||"").replace(/\s+/g,"");return{type:l.length>=5?"bbfs":"paito",red:ambilDigit(t),white:ambilDigit(l),rawRight:l}}let l=n.replace(/\s+/g,"");return{type:"line2d",red:ambilDigit(l,l.length),white:"",rawRight:""}}));data=n.map(((e,t)=>{let l="";if("vs_format"===e.type)l="";else if(t===n.length-1)l="?";else{let a=n[t+1].red.replace(/[^0-9]/g,"");if(a.length>=4&&e.rawRight){let t=e.rawRight.replace(/[^0-9]/g,""),n=t.charAt(0),i=t.charAt(1),r=a.charAt(2),d=a.charAt(3),s=n===r||i===r,o=n===d||i===d;l=s&&o?"2D":s?"KPLA":o?"EKOR":"ZONK"}else l="ZONK"}return{...e,status:l}})),updateTitleAndFlag(),render()
}

function render(){let e="";data.forEach((t=>{let n="";if(t.status){let e="status-zonk";"KPLA"===t.status?e="status-kpla":"EKOR"===t.status?e="status-ekor":"2D"===t.status?e="status-2d":"?"===t.status&&(e="status-q"),n=`<span class="status-badge ${e}">${t.status}</span>`}let l="",a="row";if("line2d_group"===t.type){a="row row-center";let e="";t.items.forEach(((n,l)=>{let a=(t.rawItems&&t.rawItems[l]?t.rawItems[l]:"").includes(",");e+=`<div class="${a?"ball line2d-ball neon-green":"ball line2d-ball"}">${n}</div>`,l<t.items.length-1&&(e+='<span class="star-sep">*</span>')})),l=e}else"line2d"===t.type?l=`${makeBalls(t.red,"red",!1)}`:"paito"===t.type?l=`${makeBalls(t.red,"red",!1)}<div class="colon">:</div>${makeBalls(t.white,"white",!1)}`:"vs_format"===t.type?(a="row row-vs",l=`${makeBalls(t.red,"red",!0)}<div class="colon bbfs-colon">:</div>${makeBalls(t.white1,"white",!0)}<span class="vs-3d">VS</span>${makeBalls(t.white2,"white",!0)}`):l=`${makeBalls(t.red,"red",!0)}<div class="colon bbfs-colon">:</div>${makeBalls(t.white,"white",!0)}`;e+=`\n<div class="${a}">\n<div class="row-content">${l}</div>${n}\n</div>\n`})),document.getElementById("output").innerHTML=e,setTimeout(drawConnectingLines,50)}

function drawConnectingLines(){let e=document.getElementById("lineSvg");if(!e)return;e.innerHTML="";let t=document.getElementById("capture").getBoundingClientRect(),n=document.querySelectorAll("#output .row"),l=[];n.forEach(((e,n)=>{let a=e.querySelector(".status-badge");if(!a)return;let i=a.innerText;if("KPLA"===i||"EKOR"===i||"2D"===i){let a=e.querySelectorAll(".white");if(0===a.length)return;let r=a[0],d=data[n],s=data[n+1];if(d&&s&&s.red){let e=d.white||"",t=e.charAt(0),n=e.charAt(1),l=s.red.replace(/[^0-9]/g,""),o=l.charAt(2),u=l.charAt(3);"KPLA"===i?t===o&&a.length>0?r=a[0]:n===o&&a.length>1&&(r=a[1]):"EKOR"===i?t===u&&a.length>0?r=a[0]:(n===u&&a.length>1||a.length>1)&&(r=a[1]):"2D"===i&&(t===o&&a.length>0?r=a[0]:n===o&&a.length>1&&(r=a[1]))}let o=r.getBoundingClientRect(),u=o.left+o.width/2-t.left,c=o.top+o.height/2-t.top;l.push({x:u,y:c})}}));for(let t=0;t<l.length-1;t++){let n=l[t],a=l[t+1],i=document.createElementNS("http://www.w3.org/2000/svg","line");i.setAttribute("x1",n.x),i.setAttribute("y1",n.y),i.setAttribute("x2",a.x),i.setAttribute("y2",a.y),i.setAttribute("stroke","#00FF00"),i.setAttribute("stroke-width","4"),i.setAttribute("stroke-linecap","round"),i.style.filter="drop-shadow(0 0 6px rgba(0,255,0,0.8))",e.appendChild(i)}}

function resetData(){
    document.getElementById("input").value="",document.getElementById("output").innerHTML="",document.getElementById("lineSvg").innerHTML="";
    let captureEl=document.getElementById("capture");
    captureEl.classList.remove("mode-kupon");
    document.getElementById("tanggal").style.display="block";
    document.getElementById("bendera").style.display="block";
    document.getElementById("promoBox").style.display="block";
    document.getElementById("footerBox").style.display="block";
    updateTitleAndFlag()
}

function downloadImage(){
    let e=document.getElementById("flag"),
        t=(e.options[e.selectedIndex].getAttribute("data-market")||"hk").toLowerCase(),
        tglInput=document.getElementById("tanggal").value.trim().toLowerCase(),
        n=tglInput.replace(/[\/,]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-"),
        l=document.getElementById("input").value.trim(),
        prefix = (l.includes(":") || l.includes("vs")) ? "prediksi" : "angka-2d",
        a=`${prefix}-${t}-${n}.png`;
        
    html2canvas(document.getElementById("capture"),{backgroundColor:null,scale:2,useCORS:!0}).then((function(e){
        let t=document.createElement("a");
        t.download=a,t.href=e.toDataURL("image/png"),t.click()
    }))
}

function copyOutput(){let e=document.getElementById("titleText").innerText,t=document.getElementById("tanggal").value,n=document.getElementById("input").value.trim();if(!n)return void alert("Belum ada data untuk disalin!");let l=`${e}\n${t}\n\n${n}`;navigator.clipboard.writeText(l).then((()=>{alert("Berhasil menyalin teks hasil prediksi!")})).catch((e=>{alert("Gagal menyalin teks.")}))}

setTodayCalendar(),updateTitleAndFlag()
</script>
</body>
