<!doctype html>
<html lang=id>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Prediksi Togel Jitu</title>
<script src=https://html2canvas.hertzen.com/dist/html2canvas.min.js></script>
<style>body{background:#111;color:#fff;font-family:Arial,sans-serif;padding:15px;display:flex;flex-direction:column;align-items:center}button,input[type=date],select,textarea{width:100%;max-width:360px;padding:10px;margin:5px 0;border:none;border-radius:8px;box-sizing:border-box}button{background:#fc0;font-weight:700;cursor:pointer}textarea{height:160px}input[type=date]{background:#222;color:#fff;border:1px solid #444;font-size:14px;text-align:center;font-weight:700}#capture{width:100%;max-width:450px;padding:15px;text-align:center;border-radius:12px;background:#111;transition:background .3s ease}.row{background:#000;padding:10px;margin:8px 0;border-radius:10px;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}.ball{width:32px;height:32px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:22px;font-weight:900}.red{background:red;color:#fff}.white{background:#fff;color:#000}.colon{font-size:28px;font-weight:700}#tanggal{display:block;width:fit-content;min-width:260px;max-width:90%;margin:0 auto 10px auto;text-align:center;font-weight:700;font-size:16px;color:#0f6;background:#000;border:1px solid #0f6;border-radius:25px;padding:8px 20px;box-sizing:border-box}.footer{margin-top:15px;font-size:14px;font-weight:700;color:#0f0;text-shadow:0 0 3px #0f0;opacity:1}</style>
</head>
<body>
<select id=flag onchange=updateTitleAndFlag()>
<option value=🇳🇿 data-name=SDY data-market=sdy data-bg=#002b49>🇳🇿 SDY POOLS</option>
<option value=🇸🇬 data-name=SGP data-market=sgp data-bg=#003300>🇸🇬 SGP</option>
<option value=🇭🇰 data-name=HK data-market=hk data-bg=#8b0000>🇭🇰 HK POOLS</option>
<option value=🇳🇿 data-name="SDY LOTTO" data-market=sdylotto data-bg=#ff5500>🇳🇿 SDY LOTTO</option>
<option value=🇭🇰 data-name="HK LOTTO" data-market=hklotto data-bg=#cc4400>🇭🇰 HK LOTTO</option>
</select>
<input type=date id=inputCalendar onchange=formatTanggalKalender()>
<textarea id=input placeholder="Contoh Paito dengan titik dua:
0933:02
1521:08

Atau contoh Line 2D tanpa titik dua:
12
21
34"></textarea>
<button onclick=generate()>✔ Proses</button>
<button onclick=resetData()>🔄 Reset</button>
<button onclick=downloadImage()>📥 Download Gambar</button>
<div id=capture>
<h2 id=titleText contenteditable=true>PREDIKSI HK HARI INI</h2>
<input id=tanggal placeholder="Hari dan tanggal bisa diubah manual">
<div id=bendera style="font-size:30px;margin:8px 0"></div>
<div id=output></div>
<div class=footer>© TUNGGAL PAITO</div>
</div>
<script>function setTodayCalendar(){let e=new Date,t=e.getFullYear(),n=String(e.getMonth()+1).padStart(2,"0"),l=String(e.getDate()).padStart(2,"0");document.getElementById("inputCalendar").value=`${t}-${n}-${l}`,formatTanggalKalender()}function formatTanggalKalender(){let e=document.getElementById("inputCalendar").value;if(!e)return;let t=e.split("-"),n=new Date(t[0],t[1]-1,t[2]).toLocaleDateString("id-ID",{weekday:"long",year:"numeric",month:"long",day:"numeric"});document.getElementById("tanggal").value=n}function updateTitleAndFlag(){let e=document.getElementById("flag"),t=e.options[e.selectedIndex],n=t.value,l=t.getAttribute("data-name"),a=t.getAttribute("data-bg");document.getElementById("bendera").innerText=n,document.getElementById("capture").style.background=a;let d=document.getElementById("input").value.trim(),i=d.length>0&&!d.includes(":");document.getElementById("titleText").innerText=i?"LINE 2D "+l+" HARI INI":"PREDIKSI "+l+" HARI INI"}setTodayCalendar(),updateTitleAndFlag();let data=[];function makeBalls(e,t){let n="";const l=[...e];for(let e=0;e<l.length;e++){let a=l[e];"̶"===l[e+1]&&(a+=l[e+1],e++),n+=`<div class="ball ${t}">${a}</div>`}return n}function ambilDigit(e,t){let n="",l=0;for(let a=0;a<e.length&&(n+=e[a],/[0-9]/.test(e[a])&&l++,"̶"===e[a+1]&&(n+=e[a+1],a++),!(l>=t));a++);return n}function generate(){let e=document.getElementById("input").value.split("\n").filter((e=>""!==e.trim()));data=e.map((e=>{let t=e.trim();if(t.includes(":")){let e=t.split(":"),n=(e[0]||"").replace(/\s+/g,""),l=(e[1]||"").replace(/\s+/g,"");return{type:"paito",red:ambilDigit(n,4),white:ambilDigit(l,4)}}{let e=t.replace(/\s+/g,"");return{type:"line2d",red:ambilDigit(e,e.length)}}})),updateTitleAndFlag(),render()}function render(){let e="";data.forEach((t=>{"line2d"===t.type?e+=`\n<div class="row">\n${makeBalls(t.red,"red")}\n</div>\n`:e+=`\n<div class="row">\n${makeBalls(t.red,"red")}\n<div class="colon">:</div>\n${makeBalls(t.white,"white")}\n</div>\n`})),document.getElementById("output").innerHTML=e}function resetData(){document.getElementById("input").value="",document.getElementById("output").innerHTML="",updateTitleAndFlag()}function downloadImage(){let e=document.getElementById("flag"),t=(e.options[e.selectedIndex].getAttribute("data-market")||"pasaran").toLowerCase(),n=document.getElementById("input").value.trim(),l=`${n.length>0&&!n.includes(":")?"line-2d":"prediksi-"}${t}-${document.getElementById("tanggal").value.trim().toLowerCase().replace(/[\/,]/g,"-").replace(/\s+/g,"-").replace(/-+/g,"-")}.png`;html2canvas(document.getElementById("capture"),{backgroundColor:null,scale:2,useCORS:!0}).then((function(e){let t=document.createElement("a");t.download=l,t.href=e.toDataURL("image/png"),t.click()}))}</script>
<script>document.addEventListener("contextmenu",(e=>e.preventDefault())),document.onkeydown=function(e){return 123!=e.keyCode&&(!e.ctrlKey||!e.shiftKey||e.keyCode!="I".charCodeAt(0))&&(!e.ctrlKey||!e.shiftKey||e.keyCode!="C".charCodeAt(0))&&(!e.ctrlKey||!e.shiftKey||e.keyCode!="J".charCodeAt(0))&&(!e.ctrlKey||e.keyCode!="U".charCodeAt(0))&&void 0}</script>
</body>
</html>
