<style>
body{background:#000;color:#fff;font-family:Arial,sans-serif;padding:15px;display:flex;flex-direction:column;align-items:center}button,input[type=date],select,textarea{width:100%;max-width:360px;padding:10px;margin:5px 0;border:1px solid #f33;border-radius:8px;box-sizing:border-box;box-shadow:0 0 8px rgba(255,0,0,.4)}button{background:#fc0;color:#000;font-weight:700;cursor:pointer;border:none;box-shadow:0 0 10px rgba(255,204,0,.6)}textarea{height:160px;background:#000;color:#fff}input[type=date]{background:#000;color:#fff;border:1px solid #f33;font-size:14px;text-align:center;font-weight:700}select{background:#000;color:#fff}#capture{width:100%;max-width:480px;padding:20px;text-align:center;border-radius:16px;background:#000;border:2px solid #fff;box-shadow:0 0 20px rgba(255,255,255,.8),0 0 40px rgba(255,255,255,.4),inset 0 0 15px rgba(255,255,255,.3);transition:background .3s ease,box-shadow .3s ease;margin-top:10px;position:relative}

.row-content{display:flex;align-items:center;justify-content:center;gap:4px}
.row.row-vs{justify-content:center;gap:2px;overflow:hidden}.row.row-vs .row-content{gap:2px;flex-wrap:nowrap;width:100%;overflow:hidden}.row.row-vs .ball{width:22px;height:22px;font-size:11px}.row.row-vs .ball.bbfs-ball{width:20px;height:20px;font-size:10px}.row.row-vs .colon{font-size:14px;margin:0 1px}.row.row-vs .vs-3d{font-size:11px;margin:0 2px}

<script>
function setTodayCalendar(){let e=new Date,t=e.getFullYear(),l=String(e.getMonth()+1).padStart(2,"0"),a=String(e.getDate()).padStart(2,"0");document.getElementById("inputCalendar").value=`${t}-${l}-${a}`,formatTanggalKalender()}function formatTanggalKalender(){let e=document.getElementById("inputCalendar").value;if(!e)return;let t=e.split("-"),l=new Date(t[0],t[1]-1,t[2]).toLocaleDateString("id-ID",{weekday:"long",year:"numeric",month:"long",day:"numeric"});document.getElementById("tanggal").value=l}function updateTitleAndFlag(){let e=document.getElementById("flag"),t=e.options[e.selectedIndex],l=t.value,a=t.getAttribute("data-name"),n=t.getAttribute("data-bg");document.getElementById("bendera").innerText=l,document.getElementById("capture").style.background=n;let i=document.getElementById("input").value.trim(),s=i.split("\n").filter((e=>""!==e.trim()));if(0===s.length)return void(document.getElementById("titleText").innerText="PREDIKSI "+a+" HARI INI");s.some((e=>e.includes("vs"))),s.some((e=>e.includes(":")));let d=!i.includes(":")&&!i.includes("vs");document.getElementById("titleText").innerText=d?"ANGKA 2D "+a+" HARI INI":"PREDIKSI "+a+" HARI INI"}let data=[];function makeBalls(e,t,l){let a="";const n=[...e];let i=l?`ball ${t} bbfs-ball`:`ball ${t}`;for(let e=0;e<n.length;e++){let t=n[e];"̶"===n[e+1]&&(t+=n[e+1],e++),a+=`<div class="${i}">${t}</div>`}return a}function ambilDigit(e,t){let l="",a=0,n=t||e.length;for(let t=0;t<e.length&&(l+=e[t],/[0-9]/.test(e[t])&&a++,"̶"===e[t+1]&&(l+=e[t+1],t++),!(a>=n));t++);return l}function generate(){let e=document.getElementById("input").value.trim();if(!e)return data=[],updateTitleAndFlag(),void render();if(!e.includes(":")&&!e.includes("vs")){let rawItems=e.split(/[\s\n]+/).filter(x=>x.trim().length>0);let chunks=[];for(let t=0;t<rawItems.length;t+=5)chunks.push(rawItems.slice(t,t+5));data=chunks.map((chunk,idx)=>({type:"line2d_group",items:chunk.map(item=>item.replace(/[^0-9]/g,"")),rawItems:chunk,status:""}))}else{let t=e.split("\n").filter((e=>""!==e.trim()));let eList=t.map(((e,t)=>{let l=e.trim();if(l.includes("vs")){let e=l.split(":"),t=(e[0]||"").replace(/\s+/g,""),a=(e[1]||"").split("vs"),n=(a[0]||"").replace(/\s+/g,""),i=(a[1]||"").replace(/\s+/g,"");return{type:"vs_format",red:ambilDigit(t),white1:ambilDigit(n),white2:ambilDigit(i),rawRight:n+i}}if(l.includes(":")){let e=l.split(":"),t=(e[0]||"").replace(/\s+/g,""),a=(e[1]||"").replace(/\s+/g,"");return{type:a.length>=5?"bbfs":"paito",red:ambilDigit(t),white:ambilDigit(a),rawRight:a}}let a=l.replace(/\s+/g,"");return{type:"line2d",red:ambilDigit(a,a.length),white:"",rawRight:""}}));data=eList.map(((t,l)=>{let a="";if("vs_format"===t.type)a="";else if(l===eList.length-1)a="?";else{let n=eList[l+1].red.replace(/[^0-9]/g,"");if(n.length>=4&&t.rawRight){let e=t.rawRight.replace(/[^0-9]/g,""),l=e.charAt(0),i=e.charAt(1),s=n.charAt(2),d=n.charAt(3),r=l===s||i===s,u=l===d||i===d;a=r&&u?"2D":r?"KPLA":u?"EKOR":"ZONK"}else a="ZONK"}return{...t,status:a}}))}updateTitleAndFlag(),render()}function render(){let e="";data.forEach((t=>{let l="";if(t.status){let e="status-zonk";"KPLA"===t.status?e="status-kpla":"EKOR"===t.status?e="status-ekor":"2D"===t.status?e="status-2d":"?"===t.status&&(e="status-q"),l=`<span class="status-badge ${e}">${t.status}</span>`}let a="",n="row";if("line2d_group"===t.type){n="row row-center";let e="";t.items.forEach(((val,idx)=>{let originalToken = t.rawItems && t.rawItems[idx] ? t.rawItems[idx] : "";let isNeon = originalToken.includes(",");let ballClass = isNeon ? "ball line2d-ball neon-green" : "ball line2d-ball";e+=`<div class="${ballClass}">${val}</div>`,idx<t.items.length-1&&(e+='<span class="star-sep">*</span>')})),a=e}else"line2d"===t.type?a=`${makeBalls(t.red,"red",!1)}`:"paito"===t.type?a=`${makeBalls(t.red,"red",!1)}<div class="colon">:</div>${makeBalls(t.white,"white",!1)}`:"vs_format"===t.type?(n="row row-vs",a=`${makeBalls(t.red,"red",!0)}<div class="colon bbfs-colon">:</div>${makeBalls(t.white1,"white",!0)}<span class="vs-3d">VS</span>${makeBalls(t.white2,"white",!0)}`):a=`${makeBalls(t.red,"red",!0)}<div class="colon bbfs-colon">:</div>${makeBalls(t.white,"white",!0)}`;e+=`\n<div class="${n}">\n<div class="row-content">${a}</div>${l}\n</div>\n`})),document.getElementById("output").innerHTML=e;setTimeout(drawConnectingLines, 50);}

function drawConnectingLines() {
    let svg = document.getElementById('lineSvg');
    if (!svg) return;
    svg.innerHTML = '';

    let captureRect = document.getElementById('capture').getBoundingClientRect();
    let rows = document.querySelectorAll('#output .row');
    let points = [];

    rows.forEach((row, idx) => {
        let statusBadge = row.querySelector('.status-badge');
        if (!statusBadge) return;
        let status = statusBadge.innerText;
        
        if (status === 'KPLA' || status === 'EKOR' || status === '2D') {
            let whiteBalls = row.querySelectorAll('.white');
            if (whiteBalls.length === 0) return;

            let targetBall = whiteBalls[0];
            let rowData = data[idx];
            let nextRowData = data[idx + 1];

            if (rowData && nextRowData && nextRowData.red) {
                let whiteStr = rowData.white || '';
                let l = whiteStr.charAt(0);
                let i = whiteStr.charAt(1);

                let nextRed = nextRowData.red.replace(/[^0-9]/g, '');
                let s = nextRed.charAt(2); // Kepala baris berikutnya
                let d = nextRed.charAt(3); // Ekor baris berikutnya

                // Patokan berdasarkan nilai status yang masuk
                if (status === 'KPLA') {
                    if (l === s && whiteBalls.length > 0) targetBall = whiteBalls[0];
                    else if (i === s && whiteBalls.length > 1) targetBall = whiteBalls[1];
                } else if (status === 'EKOR') {
                    if (l === d && whiteBalls.length > 0) targetBall = whiteBalls[0];
                    else if (i === d && whiteBalls.length > 1) targetBall = whiteBalls[1];
                    else if (whiteBalls.length > 1) targetBall = whiteBalls[1];
                } else if (status === '2D') {
                    if (l === s && whiteBalls.length > 0) targetBall = whiteBalls[0];
                    else if (i === s && whiteBalls.length > 1) targetBall = whiteBalls[1];
                }
            }

            let ballRect = targetBall.getBoundingClientRect();
            let x = ballRect.left + ballRect.width / 2 - captureRect.left;
            let y = ballRect.top + ballRect.height / 2 - captureRect.top;
            points.push({x, y});
        }
    });

    for (let i = 0; i < points.length - 1; i++) {
        let p1 = points[i];
        let p2 = points[i+1];
        let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', p1.x);
        line.setAttribute('y1', p1.y);
        line.setAttribute('x2', p2.x);
        line.setAttribute('y2', p2.y);
        line.setAttribute('stroke', '#00FF00');
        line.setAttribute('stroke-width', '4');
        line.setAttribute('stroke-linecap', 'round');
        line.style.filter = 'drop-shadow(0 0 6px rgba(0,255,0,0.8))';
        svg.appendChild(line);
    }
}

function resetData(){document.getElementById("input").value="",document.getElementById("output").innerHTML="",document.getElementById("lineSvg").innerHTML="",updateTitleAndFlag()}function downloadImage(){let e=document.getElementById("flag"),t=(e.options[e.selectedIndex].getAttribute("data-market")||"hk").toLowerCase(),l=document.getElementById("tanggal").value.trim().toLowerCase().replace(/[\/,]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-"),a=document.getElementById("input").value.trim(),n=`${!a.includes(":")&&!a.includes("vs")?"angka-2d":"prediksi"}-${t}-${l}.png`;html2canvas(document.getElementById("capture"),{backgroundColor:"#000000",scale:2,useCORS:!0}).then((function(e){let t=document.createElement("a");t.download=n,t.href=e.toDataURL("image/png"),t.click()}))}

function copyOutput() {
    let title = document.getElementById("titleText").innerText;
    let tanggal = document.getElementById("tanggal").value;
    let rawInput = document.getElementById("input").value.trim();
    
    if(!rawInput) {
        alert("Belum ada data untuk disalin!");
        return;
    }

    let textToCopy = `${title}\n${tanggal}\n\n${rawInput}`;
    navigator.clipboard.writeText(textToCopy).then(() => {
        alert("Berhasil menyalin teks hasil prediksi!");
    }).catch(err => {
        alert("Gagal menyalin teks.");
    });
}

setTodayCalendar()</script>
