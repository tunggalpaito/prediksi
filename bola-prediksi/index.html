<!doctype html>
<html lang=id>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Prediksi Togel Jitu & Neon</title>
<script src=https://html2canvas.hertzen.com/dist/html2canvas.min.js></script>
<style>
body{background:#000;color:#fff;font-family:Arial,sans-serif;padding:15px;display:flex;flex-direction:column;align-items:center}button,input[type=date],select,textarea{width:100%;max-width:360px;padding:10px;margin:5px 0;border:1px solid #f33;border-radius:8px;box-sizing:border-box;box-shadow:0 0 8px rgba(255,0,0,.4)}button{background:#fc0;color:#000;font-weight:700;cursor:pointer;border:none;box-shadow:0 0 10px rgba(255,204,0,.6)}textarea{height:160px;background:#000;color:#fff}input[type=date]{background:#000;color:#fff;border:1px solid #f33;font-size:14px;text-align:center;font-weight:700}select{background:#000;color:#fff}#capture{width:100%;max-width:480px;padding:20px;text-align:center;border-radius:16px;background:#000;border:2px solid #fff;box-shadow:0 0 20px rgba(255,255,255,.8),0 0 40px rgba(255,255,255,.4),inset 0 0 15px rgba(255,255,255,.3);transition:background .3s ease,box-shadow .3s ease;margin-top:10px}.row{background:#000;padding:8px 12px;margin:8px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:nowrap;overflow-x:auto;max-width:100%;border:1px solid rgba(255,255,255,.2)}.row::-webkit-scrollbar{height:3px}.row::-webkit-scrollbar-thumb{background:#555;border-radius:3px}.row-content{display:flex;align-items:center;justify-content:center;gap:4px;flex-grow:1}.ball{width:34px;height:34px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:18px;font-weight:900;flex-shrink:0}.ball.line2d-ball{width:30px;height:30px;font-size:15px;background:#333;color:#fff;border:1px solid #777}.star-sep{font-size:16px;font-weight:700;color:#f33;margin:0 2px;flex-shrink:0}

/* PERBAIKAN: Garis hijau neon tebal (3px) solid tanpa shadow */
.neon-green{
    background: #333 !important;
    color: #fff !important;
    border: 3px solid #00FF00 !important;
    box-shadow: none !important;
}

#capture h2{font-size:1.5em;margin:10px 0 2px 0;color:#0f0;text-shadow:0 0 10px rgba(0,255,0,.8)}#tanggal{display:block;width:100%;margin:0 auto 8px auto;text-align:center;font-weight:900;font-size:1.15em;font-family:'Courier New',Courier,monospace;color:#ffffff;text-shadow:0 0 5px rgba(255,255,255,0.5);background:transparent;border:none;border-radius:0;padding:0;box-sizing:border-box;box-shadow:none;letter-spacing:0px}.footer{margin-top:15px;font-size:15px;font-weight:900;letter-spacing:1px;background:linear-gradient(180deg,#66d9ff 0,#0080ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 1px 0 #036,0 2px 0 #024,0 3px 6px rgba(0,0,0,.9),0 0 10px rgba(0,162,255,.8);opacity:1}
</style>
</head>
<body>
<select id=flag onchange=updateTitleAndFlag()>
<option value=🇳🇿 data-name=SDY data-market=sdy data-bg=#000000>🇳🇿 SDY POOLS</option>
<option value=🇸🇬 data-name=SGP data-market=sgp data-bg=#000000>🇸🇬 SGP</option>
<option value=🇭🇰 data-name=HK data-market=hk data-bg=#000000>🇭🇰 HK POOLS</option>
</select>
<input type=date id=inputCalendar onchange=formatTanggalKalender()>
<textarea id=input placeholder="Masukkan angka, contoh:
60
6,2
63
65
67"></textarea>
<button onclick=generate()>✔ Proses</button>
<button onclick=resetData()>🔄 Reset</button>
<button onclick=downloadImage()>📥 Download Gambar</button>
<div id=capture>
<h2 id=titleText contenteditable=true>ANGKA 2D SDY HARI INI</h2>
<input id=tanggal placeholder="Hari dan tanggal bisa diubah manual">
<div id=bendera style="font-size:30px;margin:8px 0"></div>
<div id=output></div>
<div class=footer>© TUNGGAL PAITO</div>
</div>
<script>
function setTodayCalendar(){let e=new Date,t=e.getFullYear(),l=String(e.getMonth()+1).padStart(2,"0"),a=String(e.getDate()).padStart(2,"0");document.getElementById("inputCalendar").value=`${t}-${l}-${a}`,formatTanggalKalender()}
function formatTanggalKalender(){let e=document.getElementById("inputCalendar").value;if(!e)return;let t=e.split("-"),l=new Date(t[0],t[1]-1,t[2]).toLocaleDateString("id-ID",{weekday:"long",year:"numeric",month:"long",day:"numeric"});document.getElementById("tanggal").value=l}
function updateTitleAndFlag(){let e=document.getElementById("flag"),t=e.options[e.selectedIndex],l=t.value,a=t.getAttribute("data-name"),n=t.getAttribute("data-bg");document.getElementById("bendera").innerText=l,document.getElementById("capture").style.background=n;let i=document.getElementById("input").value.trim();if(!i)return void(document.getElementById("titleText").innerText="ANGKA 2D "+a+" HARI INI");document.getElementById("titleText").innerText="ANGKA 2D "+a+" HARI INI"}

let data=[];

function generate(){
    let rawInput = document.getElementById("input").value.trim();
    if(!rawInput) return data=[], updateTitleAndFlag(), void render();
    
    let lines = rawInput.split("\n").map(e => e.trim()).filter(e => e !== "");
    let items = [];

    lines.forEach(line => {
        if(line.includes(",")){
            let cleanNum = line.replace(/[^0-9]/g, "");
            if(cleanNum.length >= 2){
                items.push({ val: cleanNum, neon: true });
            }
        } else {
            let cleanNum = line.replace(/[^0-9]/g, "");
            if(cleanNum.length >= 2){
                items.push({ val: cleanNum, neon: false });
            }
        }
    });

    let grouped = [];
    for(let i=0; i<items.length; i+=5){
        grouped.push(items.slice(i, i+5));
    }
    
    data = grouped;
    updateTitleAndFlag();
    render();
}

function render(){
    let htmlOutput = "";
    data.forEach(group => {
        let rowContent = "";
        group.forEach((item, index) => {
            let ballClass = item.neon ? "ball line2d-ball neon-green" : "ball line2d-ball";
            rowContent += `<div class="${ballClass}">${item.val}</div>`;
            if(index < group.length - 1){
                rowContent += '<span class="star-sep">*</span>';
            }
        });
        htmlOutput += `\n<div class="row">\n<div class="row-content">${rowContent}</div>\n</div>\n`;
    });
    document.getElementById("output").innerHTML = htmlOutput;
}

function resetData(){
    document.getElementById("input").value="";
    document.getElementById("output").innerHTML="";
    updateTitleAndFlag();
}

function downloadImage(){
    let e=document.getElementById("flag"),t=(e.options[e.selectedIndex].getAttribute("data-market")||"hk").toLowerCase(),l=document.getElementById("tanggal").value.trim().toLowerCase().replace(/[\/,]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-");
    let n=`angka-2d-${t}-${l}.png`;
    html2canvas(document.getElementById("capture"),{backgroundColor:"#000000",scale:2,useCORS:!0}).then((function(e){let t=document.createElement("a");t.download=n,t.href=e.toDataURL("image/png");t.click();}))
}

setTodayCalendar();
</script>
<script>document.addEventListener("contextmenu",(e=>e.preventDefault()))</script>
</body>
</html>
