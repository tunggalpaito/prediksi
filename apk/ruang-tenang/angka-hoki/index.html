<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <meta name="color-scheme" content="dark">
  <title>Ruang Tenang &amp; Takdir Harian - Tunggal Paito</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Orbitron:wght@700;800;900&display=swap");

    :root {
      --bg-main: #050508;
      --bg-card: #12090e;
      --maroon-accent: #ff1e56;
      --maroon-crimson: #e11d48;
      --maroon-dark: #881337;
      --maroon-border: rgba(255, 30, 86, 0.28);
      --maroon-border-bright: rgba(255, 77, 121, 0.55);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: clip;
      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(255, 30, 86, 0.18) 0%, rgba(22, 10, 16, 0.92) 55%, #050508 100%),
        linear-gradient(rgba(255, 30, 86, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 30, 86, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 24px 24px, 24px 24px;
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 12px 24px 12px;
      position: relative;
    }

    body ::selection {
      background-color: #e11d48;
      color: #ffffff;
    }

    .phantom-number {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: "Orbitron", sans-serif;
      font-size: clamp(11rem, 48vw, 22rem);
      font-weight: 900;
      color: rgba(255, 30, 86, 0.035);
      z-index: 0;
      pointer-events: none;
      transition: opacity 1.4s ease-in-out;
      opacity: 0;
      user-select: none;
    }

    .phantom-number.visible {
      opacity: 1;
    }

    .top-nav {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 6px 0;
      z-index: 2;
    }

    .btn-menu {
      min-height: 44px;
      background: linear-gradient(145deg, rgba(28, 11, 18, 0.92), rgba(12, 6, 9, 0.96));
      color: #fda4af;
      border: 1px solid var(--maroon-border);
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 14px;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    .btn-menu:hover {
      background: linear-gradient(135deg, #ff1e56, #9f1239);
      color: #ffffff;
      border-color: rgba(255, 130, 160, 0.5);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(255, 30, 86, 0.35);
    }

    .container {
      max-width: 540px;
      width: 100%;
      background: linear-gradient(150deg, rgba(24, 10, 16, 0.92), rgba(9, 4, 7, 0.97));
      border: 1px solid var(--maroon-border);
      border-radius: 22px;
      text-align: center;
      padding: 28px 20px;
      margin: auto;
      z-index: 2;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65);
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff1e56, #fda4af, transparent);
    }

    .breathe-circle {
      width: 64px;
      height: 64px;
      border: 2px solid rgba(255, 77, 121, 0.35);
      background: radial-gradient(circle, rgba(255, 30, 86, 0.16), transparent 75%);
      border-radius: 50%;
      margin: 0 auto 24px auto;
      animation: pulse 4s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(0.92); opacity: 0.5; box-shadow: 0 0 0 rgba(255, 30, 86, 0); }
      50% { transform: scale(1.22); opacity: 1; border-color: #ff4d79; box-shadow: 0 0 22px rgba(255, 30, 86, 0.35); }
      100% { transform: scale(0.92); opacity: 0.5; box-shadow: 0 0 0 rgba(255, 30, 86, 0); }
    }

    .suggestion-box {
      min-height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 22px;
    }

    .suggestion-text {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.75;
      color: #f3f4f6;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 1s ease, transform 1s ease;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }

    .suggestion-text.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .action-section {
      opacity: 0;
      transition: opacity 1.2s ease;
      pointer-events: none;
      display: none;
    }

    .action-section.active {
      display: block;
      opacity: 1;
      pointer-events: auto;
    }

    .result-container {
      margin-top: 6px;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(2.2rem, 8vw, 3.2rem);
      letter-spacing: 4px;
      font-weight: 900;
      color: #ff4d79;
      min-height: 60px;
      text-shadow: 0 0 20px rgba(255, 30, 86, 0.55);
    }

    .market-recommendation {
      margin-top: 18px;
      padding: 15px 14px;
      background: rgba(255, 30, 86, 0.1);
      border: 1px solid var(--maroon-border);
      border-radius: 14px;
      font-size: 0.98rem;
      line-height: 1.55;
      color: #f9fafb;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      animation: fadeInMarket 0.8s ease forwards;
    }

    .market-recommendation strong {
      font-family: "Orbitron", sans-serif;
      color: #fda4af;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
    }

    @keyframes fadeInMarket {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .locked-notice {
      margin-top: 14px;
      font-size: 0.88rem;
      line-height: 1.5;
      color: var(--text-muted);
      font-style: italic;
    }

    footer {
      width: 100%;
      max-width: 600px;
      text-align: center;
      padding: 14px 8px 4px 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 30, 86, 0.18);
      z-index: 2;
    }

    footer strong {
      font-family: "Orbitron", sans-serif;
      color: #ff1e56;
    }
  </style>
</head>
<body>
  <div id="phantomNumber" class="phantom-number" aria-hidden="true">-</div>

  <nav class="top-nav" aria-label="Navigasi Utama">
    <a href="https://tunggalpaito.online/prediksi" class="btn-menu" id="btnBack">
      <svg style="width:16px;height:16px;fill:currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      <span>Menu Utama</span>
    </a>
  </nav>

  <main class="container">
    <div class="breathe-circle" aria-hidden="true"></div>

    <div class="suggestion-box">
      <p id="suggestionText" class="suggestion-text"></p>
    </div>

    <div id="actionSection" class="action-section">
      <div id="resultContainer" class="result-container"></div>
      <div id="marketRecommendation" class="market-recommendation"></div>
      <div id="noticeContainer" class="locked-notice"></div>
    </div>
  </main>

  <footer>
    &copy; <span id="currentYear"></span> <strong>Tunggal Paito</strong>. All Rights Reserved.
  </footer>

  <script>
  (function() {
    "use strict";

    const STORAGE_KEY = "tunggal_paito_harian_pilih_pasaran";
    const yearEl = document.getElementById("currentYear");
    if (yearEl) yearEl.textContent = String(new Date().getFullYear());

    const sugestiList = [
      "Tarik napas perlahan... hembuskan perlahan. Rasakan ketenangan mengalir di setiap otot tubuh Anda.",
      "Pundak dan leher Anda mulai terasa semakin longgar, ringan, dan bebas dari segala beban pikiran.",
      "Pikiran Anda perlahan menjadi sangat jernih, hening, damai, dan selaras dengan alam semesta.",
      "Nikmati keheningan ini... biarkan tubuh dan jiwa Anda benar-benar santai dan pasrah.",
      "Kini, biarkan ketenangan membimbing Anda menemukan angka hoki terbaik..."
    ];

    let currentIndex = 0;
    let intervalBayangan = null;
    let bayanganFadeTimer = null;
    let sugestiStepTimer = null;
    let sugestiSwapTimer = null;
    let isSessionFinished = false;

    const textElement = document.getElementById("suggestionText");
    const actionSection = document.getElementById("actionSection");
    const resultContainer = document.getElementById("resultContainer");
    const marketRecommendation = document.getElementById("marketRecommendation");
    const noticeContainer = document.getElementById("noticeContainer");
    const phantomNumber = document.getElementById("phantomNumber");

    let audioCtx = null;
    let isAudioPlaying = false;
    let audioInterval = null;

    function getAudioContext() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return null;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume().catch(function() {});
        }
        return audioCtx;
      } catch (_) {
        return null;
      }
    }

    function playSingingBowlTone() {
      if (!isAudioPlaying) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gainNode = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(174, ctx.currentTime);

        gainNode.gain.setValueAtTime(0.001, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.45);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 5.2);

        osc.connect(gainNode);
        gainNode.connect(ctx.destination);

        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 5.4);
      } catch (_) {}
    }

    function startRelaxAudio() {
      if (isAudioPlaying) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      isAudioPlaying = true;
      playSingingBowlTone();
      clearInterval(audioInterval);
      audioInterval = setInterval(function() {
        if (isAudioPlaying) {
          playSingingBowlTone();
        } else {
          clearInterval(audioInterval);
        }
      }, 5000);
    }

    function stopRelaxAudio() {
      isAudioPlaying = false;
      clearInterval(audioInterval);
      audioInterval = null;
    }

    function cleanupTimers() {
      clearInterval(intervalBayangan);
      clearTimeout(bayanganFadeTimer);
      clearTimeout(sugestiStepTimer);
      clearTimeout(sugestiSwapTimer);
      stopRelaxAudio();
    }

    function getTanggalHariIni() {
      const sekarang = new Date();
      const tahun = sekarang.getFullYear();
      const bulan = String(sekarang.getMonth() + 1).padStart(2, "0");
      const tanggal = String(sekarang.getDate()).padStart(2, "0");
      return tahun + "-" + bulan + "-" + tanggal;
    }

    function readSavedDailyData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (_) {
        return null;
      }
    }

    function writeSavedDailyData(payload) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (_) {}
    }

    function handleFirstInteraction() {
      const saved = readSavedDailyData();
      const today = getTanggalHariIni();
      const alreadyClaimedToday = Boolean(saved && saved.tanggalAmbil === today);
      if (!alreadyClaimedToday && !isSessionFinished) {
        startRelaxAudio();
      }
      window.removeEventListener("click", handleFirstInteraction);
      window.removeEventListener("touchstart", handleFirstInteraction);
      window.removeEventListener("keydown", handleFirstInteraction);
    }

    function renderLockedResult(angka, pasaran, noticeMsg) {
      if (textElement) {
        textElement.classList.remove("visible");
        textElement.textContent = "";
      }
      if (phantomNumber) {
        phantomNumber.textContent = String(angka);
        phantomNumber.style.color = "rgba(255, 30, 86, 0.05)";
        phantomNumber.style.opacity = "1";
        phantomNumber.classList.add("visible");
      }
      if (actionSection) {
        actionSection.classList.add("active");
      }
      if (resultContainer) {
        resultContainer.textContent = "✨ " + angka + " ✨";
      }
      if (marketRecommendation) {
        marketRecommendation.innerHTML = "Silahkan Beli Angka Hoki Anda Di pasaran Berikut ini :<br><strong>" + pasaran + "</strong>";
      }
      if (noticeContainer) {
        noticeContainer.textContent = noticeMsg;
      }
    }

    function gantiAngkaSamar() {
      if (!phantomNumber || isSessionFinished) return;
      phantomNumber.style.opacity = "0";
      clearTimeout(bayanganFadeTimer);
      bayanganFadeTimer = setTimeout(function() {
        if (isSessionFinished || !phantomNumber) return;
        const angkaAcak = Math.floor(Math.random() * 10);
        phantomNumber.textContent = String(angkaAcak);
        phantomNumber.style.opacity = "1";
      }, 1200);
    }

    function pilihPasaranTerbaik() {
      const hariIndex = new Date().getDay();
      const isSingaporeBuka = [1, 3, 4, 6, 0].includes(hariIndex);
      const daftarPilihan = isSingaporeBuka
        ? ["Singapore", "Sydney Pools", "Sydney Lotto", "Hongkong Pools", "Hongkong Lotto"]
        : ["Sydney Pools", "Sydney Lotto", "Hongkong Pools", "Hongkong Lotto"];
      return daftarPilihan[Math.floor(Math.random() * daftarPilihan.length)];
    }

    function selesaikanSesi() {
      if (isSessionFinished) return;
      isSessionFinished = true;
      clearInterval(intervalBayangan);
      clearTimeout(bayanganFadeTimer);

      const angkaFinal = Math.floor(Math.random() * 10);
      const rekomendasiPasaran = pilihPasaranTerbaik();

      writeSavedDailyData({
        angka: angkaFinal,
        rekomendasiPasaran: rekomendasiPasaran,
        tanggalAmbil: getTanggalHariIni()
      });

      renderLockedResult(
        angkaFinal,
        rekomendasiPasaran,
        "Angka Keberuntungan Anda Hari Ini Sudah Tepat. Silakan kembali lagi besok."
      );
      stopRelaxAudio();
    }

    function tampilkanSugesti() {
      if (isSessionFinished || !textElement) return;
      if (currentIndex >= sugestiList.length) {
        selesaikanSesi();
        return;
      }

      const kalimat = sugestiList[currentIndex];
      currentIndex += 1;

      textElement.classList.remove("visible");
      clearTimeout(sugestiSwapTimer);
      sugestiSwapTimer = setTimeout(function() {
        if (isSessionFinished || !textElement) return;
        textElement.textContent = kalimat;
        textElement.classList.add("visible");

        clearTimeout(sugestiStepTimer);
        sugestiStepTimer = setTimeout(tampilkanSugesti, 5200);
      }, 850);
    }

    function mulaiSiklusRelaksasi() {
      if (phantomNumber) {
        phantomNumber.textContent = String(Math.floor(Math.random() * 10));
        phantomNumber.classList.add("visible");
        phantomNumber.style.opacity = "1";
      }
      clearInterval(intervalBayangan);
      intervalBayangan = setInterval(gantiAngkaSamar, 3800);

      if (textElement && sugestiList.length > 0) {
        textElement.textContent = sugestiList[0];
        currentIndex = 1;
        setTimeout(function() {
          if (!isSessionFinished && textElement) {
            textElement.classList.add("visible");
          }
          clearTimeout(sugestiStepTimer);
          sugestiStepTimer = setTimeout(tampilkanSugesti, 5200);
        }, 500);
      }
    }

    function cekStatusHarian() {
      const saved = readSavedDailyData();
      const today = getTanggalHariIni();

      if (saved && saved.tanggalAmbil === today && saved.angka !== undefined && saved.rekomendasiPasaran) {
        isSessionFinished = true;
        renderLockedResult(
          saved.angka,
          saved.rekomendasiPasaran,
          "Angka Hoki Anda sudah terkunci untuk hari ini. Dapatkan lagi esok hari setelah pukul 23:59."
        );
        stopRelaxAudio();
        return;
      }

      mulaiSiklusRelaksasi();
    }

    const btnBack = document.getElementById("btnBack");
    if (btnBack) {
      btnBack.addEventListener("click", cleanupTimers);
    }

    window.addEventListener("DOMContentLoaded", function() {
      window.addEventListener("click", handleFirstInteraction, { passive: true });
      window.addEventListener("touchstart", handleFirstInteraction, { passive: true });
      window.addEventListener("keydown", handleFirstInteraction, { passive: true });
      cekStatusHarian();
    }, { once: true });

    document.addEventListener("visibilitychange", function() {
      if (document.hidden) stopRelaxAudio();
    });
    window.addEventListener("pagehide", cleanupTimers, { passive: true });
    window.addEventListener("beforeunload", cleanupTimers, { passive: true });
  })();
  </script>
</body>
</html>
